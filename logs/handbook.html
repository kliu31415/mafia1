ect x=\"16.5\" y=\"13\" width=\"5\" height=\"8\" rx=\"2\" fill=\"#475569\"/><path d=\"M12 6v4M10 8h4\" stroke=\"#ef4444\" stroke-width=\"1.6\"/><circle cx=\"12\" cy=\"15\" r=\"1.5\" fill=\"#ef4444\"/><\/svg>"}};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ROLE = Object.fromEntries(D.roles.map(r => [r.name, r])), TRAIT = Object.fromEntries(D.traits.map(t => [t.name, t]));
const FACTIONS = ["Village", "Yakuza", "Neutral"];
const fmt = (x, d = 2) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const pct = x => Math.round(100 * x) + "%";
const logistic = s => 1 / (1 + Math.exp(-s));
const svgUrl = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

// icons: one CSS rule per role icon and trait mark
document.head.insertAdjacentHTML("beforeend", "<style>" +
  Object.entries(D.icons).map(([slug, svg]) => `.i-${slug}{--icon:${svgUrl(svg)}}`).join("") +
  D.traits.map(t => `.m-${t.slug}{--mark:${svgUrl(t.mark)}}`).join("") + "</style>");
const icon = (name, cls = "") => { const r = ROLE[name]; return r ? `<span class="ic ${cls} ${r.faction} i-${r.icon}"></span>` : ""; };
const mark = (name, cls = "") => TRAIT[name] ? `<span class="mark ${cls} m-${TRAIT[name].slug}"></span>` : "";
const roleLink = (name, withIcon = true) => ROLE[name]
  ? `<a class="rl" href="#role/${encodeURIComponent(name)}">${withIcon ? icon(name, "sm") : ""}${esc(name)}</a>` : esc(name);
const traitLink = (name, withMark = true) => TRAIT[name]
  ? `<a class="tl" href="#trait/${encodeURIComponent(name)}">${withMark ? mark(name) + " " : ""}${esc(name)}</a>` : esc(name);

// text: links R-numbers, roles and traits; joins the rules' hard-wrapped lines into paragraphs and bullets
const NAMES = [...D.roles.map(r => r.name), ...D.traits.map(t => t.name)].sort((a, b) => b.length - a.length);
const LINK_RE = new RegExp(`\\b(R\\d{1,2})\\b|\\b(${NAMES.map(n => n.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&")).join("|")})\\b`, "g");
function linkify(s) {
  return esc(s).replace(LINK_RE, (m, rule, name) => rule
    ? (D.rules.some(p => p.blocks.some(b => b.label === rule)) ? `<a href="#rules/${rule}">${rule}</a>` : rule)
    : ROLE[name] ? roleLink(name, false) : traitLink(name, false));
}
const FIELD = /^([A-Z][A-Za-z' -]{0,22}):(\s|$)/;
function prose(lines) {
  const items = [];
  for (const raw of lines) {
    const t = raw.trim(); if (!t) continue;
    const indent = raw.length - raw.trimStart().length, prev = items[items.length - 1];
    const bullet = /^[-*] /.test(t), field = FIELD.test(t);
    if (!prev || bullet || field || (/:$/.test(prev.text) && prev.text.length < 60) || (indent < prev.indent && !prev.bullet))
      items.push({text: bullet ? t.slice(2) : t, bullet, indent});
    else prev.text += " " + t;
  }
  return `<div class="txt">` + items.map(it => {
    let h = linkify(it.text);
    const m = it.text.match(FIELD);
    if (m && m[1].length < 24) h = `<span class="fld">${esc(m[1])}:</span>` + linkify(it.text.slice(m[1].length + 1));
    return it.bullet ? `<div class="li" style="margin-left:${Math.max(0, it.indent - 2) * 6}px">${h}</div>` : `<p>${h}</p>`;
  }).join("") + `</div>`;
}

// ---------- Rules ----------
function renderRules() {
  let toc = "", body = "";
  for (const [pi, part] of D.rules.entries()) {
    const roles = part.title.toUpperCase().includes("ROLES");
    toc += `<b>${esc(part.title)}</b>`;
    body += `<div class="part" id="part-${pi}"><h2>${esc(part.title)}</h2>`;
    let faction = "Village", rolesToc = "";
    for (const b of part.blocks) {
      if (b.kind === "rule") {
        toc += `<a href="#rules/${b.label}" data-r="${b.label}"><span class="lbl">${b.label}</span>${esc(b.title)}</a>`;
        body += `<div class="rule card" id="r-${b.label}"><h3><span class="lbl">${b.label}</span>${esc(b.title)}</h3>${prose(b.lines)}</div>`;
      } else if (b.kind === "faction") {
        faction = FACTIONS.find(f => b.title.startsWith(f)) || "Neutral";
        if (rolesToc) toc += `<div class="roles-toc">${rolesToc}</div>`; rolesToc = "";
        toc += `<a href="#rules/f-${faction}" class="${faction}"><span class="fname">${esc(b.title)}</span></a>`;
        body += `<h3 class="faction-h ${faction}" id="r-f-${faction}"><span class="fname">${esc(b.title)}</span></h3>${prose(b.lines)}`;
      } else if (b.kind === "category") {
        body += `<div class="cat-h">${esc(b.title)} ${b.note ? `<span>(${esc(b.note)})</span>` : ""}</div>`;
      } else if (b.kind === "role") {
        rolesToc += `<a href="#rules/role-${encodeURIComponent(b.name)}" title="${esc(b.name)}">${icon(b.name, "sm")}</a>`;
        body += `<div class="rrole card" id="r-role-${encodeURIComponent(b.name)}">${icon(b.name)}<div style="flex:1">
          <div><a class="nm rl" href="#role/${encodeURIComponent(b.name)}">${esc(b.name)}</a></div>${prose(b.lines)}</div></div>`;
      } else body += `<div class="muted">${prose(b.lines)}</div>`;
    }
    if (rolesToc) toc += `<div class="roles-toc">${rolesToc}</div>`;
    body += `</div>`;
  }
  $("#toc").innerHTML = toc; $("#rulestext").innerHTML = body;
}

// ---------- Roles ----------
const RF = {faction: "", q: "", category: "", status: "", script: ""};
function powerBar(p, faction) {
  if (!p) return "";
  const lo = -1.4, hi = 1.0, x = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100, z = x(0), v = x(p.power);
  return `<div class="pw ${faction}" title="Power ${fmt(p.power)} (prior ${fmt(p.prior)}, fit from ${p.games} games): logits added to the Village's chance">
    <span>power</span><div class="track"><span class="zero" style="left:${z}%"></span><i style="left:${Math.min(z, v)}%;width:${Math.abs(v - z)}%"></i></div>
    <span>${fmt(p.power)}</span></div>`;
}
function roleChips(r) {
  return [r.night ? `<span class="chip">night action</span>` : "",
    ...Object.entries(r.tokens).map(([k, n]) => `<span class="chip">${n} ${esc(k)} token${n > 1 ? "s" : ""}</span>`),
    r.defense !== "None" ? `<span class="chip">${esc(r.defense)} Defense</span>` : "",
    r.unique ? `<span class="chip">unique</span>` : "", r.tested ? "" : `<span class="chip warn">untested live</span>`,
    ...r.off.map(s => `<span class="chip warn" title="the ${esc(s)} setup never draws it">not in ${esc(s)} setups</span>`)].join("");
}
function renderRoleFilters() {
  const cats = [...new Set(D.roles.map(r => r.category))];
  $("#rolefilters").innerHTML = `<div class="seg" id="ff">${["", ...FACTIONS].map(f => `<button data-f="${f}">${f || "All"}</button>`).join("")}</div>
    <select id="fc"><option value="">Every category</option>${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <select id="fs"><option value="">Tested or not</option><option value="tested">Live-tested</option><option value="untested">Untested live</option></select>
    <select id="fsc"><option value="">Every script</option>${Object.keys(D.scripts).filter(s => s !== "all").map(s => `<option>${esc(s)}</option>`).join("")}</select>
    <span class="muted small" id="rcount"></span>`;
  $$("#ff button").forEach(b => b.onclick = () => { RF.faction = b.dataset.f; renderRoles(); });
  $("#fc").onchange = e => { RF.category = e.target.value; renderRoles(); };
  $("#fs").onchange = e => { RF.status = e.target.value; renderRoles(); };
  $("#fsc").onchange = e => { RF.script = e.target.value; renderRoles(); };
}
const hay = r => [r.name, r.category, r.subcategory, r.summary, r.rules, r.notes, r.faction].join(" ").toLowerCase();
function renderRoles() {
  $$("#ff button").forEach(b => b.classList.toggle("on", b.dataset.f === RF.faction));
  const q = RF.q.toLowerCase();
  const shown = D.roles.filter(r => (!RF.faction || r.faction === RF.faction) && (!RF.category || r.category === RF.category)
    && (!RF.status || (RF.status === "tested") === r.tested) && (!RF.script || r.scripts.includes(RF.script))
    && (!q || hay(r).includes(q)));
  let html = "", group = "";
  for (const r of shown) {
    const g = r.faction + (r.category && r.category !== r.faction ? " · " + r.category : "");
    if (g !== group) { html += `<div class="group-h">${esc(g)}</div>`; group = g; }
    html += `<div class="rc card ${r.faction}" data-role="${esc(r.name)}"><div class="top">${icon(r.name)}
      <div><div class="nm">${esc(r.name)}</div><div class="sub">${esc(r.subcategory || r.category)}</div></div></div>
      <div class="sum">${linkify(r.summary)}</div><div>${roleChips(r)}</div>${powerBar(r.power, r.faction)}</div>`;
  }
  $("#rolegrid").innerHTML = html || `<div class="empty">No role matches.</div>`;
  $("#rcount").textContent = `${shown.length} of ${D.roles.length} roles`;
  $$("#rolegrid .rc").forEach(c => c.onclick = () => location.hash = "role/" + encodeURIComponent(c.dataset.role));
}
function renderRetired() {
  $("#retired").innerHTML = D.retired.length ? D.retired.map(r => `<div class="card panel" style="margin:8px 0">
    <b>${esc(r.name)}</b> <span class="muted small">(${esc(r.faction)}; gone from log version ${r.until}; old checkpoints resume it as ${esc(r.now)})</span>
    <div>${esc(r.summary)}</div>${r.rules ? `<div class="muted small">${linkify(r.rules)}</div>` : ""}</div>`).join("") : `<p class="muted">None.</p>`;
}
function roleDrawer(name) {
  const r = ROLE[name]; if (!r) return "";
  const p = r.power;
  return `<div class="dh">${icon(name, "lg")}<div><h2>${esc(name)}</h2><div class="muted">
    <span class="fname ${r.faction}">${r.faction}</span>${r.category !== r.faction ? " · " + esc(r.category) : ""}${r.subcategory ? " · " + esc(r.subcategory) : ""}</div></div></div>
    <div>${roleChips(r)}</div>
    <div class="box">${linkify(r.summary)}</div>
    <h3>Rules</h3>${r.rules ? prose(r.rules.split("\n")) : `<p class="muted">No rules paragraph found.</p>`}
    <p class="small"><a href="#rules/role-${encodeURIComponent(name)}">Show in the rules →</a></p>
    <dl class="kv"><dt>Sheriff sees</dt><dd>${r.sheriff}</dd><dt>Defense</dt><dd>${esc(r.defense)}</dd>
      <dt>Tokens</dt><dd>${Object.entries(r.tokens).map(([k, n]) => `${n} × ${esc(k)}`).join(", ") || "none"}</dd>
      <dt>Night action</dt><dd>${r.night ? "submits one (the moderator resolves it)" : "none submitted"}</dd>
      <dt>Live-tested</dt><dd>${r.tested ? "yes" : "not yet"}</dd>
      <dt>Scripts</dt><dd>all${r.scripts.map(s => ", " + esc(s)).join("")}</dd>
      ${p ? `<dt>Power</dt><dd>${fmt(p.power)} <span class="muted">(prior ${fmt(p.prior)}, ${p.games} game${p.games === 1 ? "" : "s"})</span></dd>` : ""}
      <dt>Traits it can get</dt><dd>${r.traits.map(t => traitLink(t)).join(", ") || "none"}</dd></dl>
    <h3>In the code</h3><dl class="kv"><dt>Hooks</dt><dd>${r.hooks.map(h => `<span class="chip">${esc(h)}</span>`).join("") || "none (the moderator handles it)"}</dd>
      <dt>Night note</dt><dd>${r.night_note ? "yes" : "no"}</dd><dt>Notes</dt><dd>${esc(r.notes) || "—"}</dd></dl>`;
}

// ---------- Traits ----------
function renderTraits() {
  $("#traitintro").innerHTML = `${D.traits.length} traits. A trait is an extra ability on top of a role (${linkify("R24")}); the mark is the corner badge the HTML logs draw on its holder's icon.`;
  const q = RF.q.toLowerCase();
  const shown = D.traits.filter(t => !q || [t.name, t.summary, t.hover, ...t.factions].join(" ").toLowerCase().includes(q));
  $("#traitgrid").innerHTML = shown.map(t => `<div class="rc card" data-trait="${esc(t.name)}"><div class="top">${mark(t.name, "lg")}
    <div><div class="nm">${esc(t.name)}</div><div class="sub">${t.factions.map(f => `<span class="fname ${f}">${f}</span>`).join(" · ")}${t.hidden ? " · hidden" : ""}</div></div></div>
    <div class="sum">${linkify(t.hover)}</div>
    <div class="pw">${Object.entries(t.village).map(([f, v]) => `<span class="${f}" title="adds ${fmt(v)} to the Village's score held by a ${f} player">${f}: <b class="fname">${fmt(v)}</b></span>`).join(" ")}</div></div>`).join("")
    || `<div class="empty">No trait matches.</div>`;
  $$("#traitgrid .rc").forEach(c => c.onclick = () => location.hash = "trait/" + encodeURIComponent(c.dataset.trait));
}
function traitDrawer(name) {
  const t = TRAIT[name]; if (!t) return "";
  return `<div class="dh">${mark(name, "lg")}<div><h2>${esc(name)}</h2><div class="muted">Trait · ${t.factions.map(f => `<span class="fname ${f}">${f}</span>`).join(", ")}${t.hidden ? " · hidden from its holder" : ""}</div></div></div>
    <div class="box">${linkify(t.summary)}</div>
    <dl class="kv"><dt>In the HTML log</dt><dd>${esc(t.hover)}</dd>
    ${Object.entries(t.powers).map(([f, p]) => `<dt>Power (${f})</dt><dd>${fmt(p.power)} for the holder's side <span class="muted">(prior ${fmt(p.prior)}, ${p.games} game${p.games === 1 ? "" : "s"})</span></dd>`).join("")}
    ${t.excludes.length ? `<dt>Never with</dt><dd>${t.excludes.map(x => traitLink(x)).join(", ")}</dd>` : ""}
    <dt>Roles that can get it</dt><dd>${t.roles.length === D.roles.length ? "every role" : t.roles.map(r => roleLink(r)).join(", ")}</dd></dl>
    <p class="small"><a href="#rules/R24">Traits in the rules (R24) →</a></p>`;
}

// ---------- Setups ----------
function oddsChart(odds, label) {
  const total = Object.values(odds).reduce((a, b) => a + b, 0), max = Math.max(...Object.values(odds));
  return `<div class="odds">${Object.entries(odds).sort((a, b) => a[0] - b[0]).map(([k, v]) =>
    `<div title="${esc(label(k))}: ${pct(v / total)}">${pct(v / total)}<i style="height:${v / max * 64}px"></i><span>${esc(label(k))}</span></div>`).join("")}</div>`;
}
function meter(chance) {
  const lo = logistic(-D.power.band), hi = logistic(D.power.band);
  return `<div class="meter" title="Village win chance ${pct(chance)} (the dashed box is the standard setup's balance band)"><span class="band" style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></span><span class="pin" style="left:${chance * 100}%"></span></div>`;
}
function traitItem(item) {
  const [names, f] = item.split("@");
  return names.split("+").map(n => traitLink(n)).join(" + ") + (f ? ` <span class="muted small">(${esc(f)})</span>` : "");
}
function renderSetups() {
  const S = D.setups, st = S.standard;
  const needs = Object.entries(st.village_needs).map(([c, n]) => `${n} ${c}`).join(", ");
  const B = D.setups.builder;
  $("#setupsbox").innerHTML = `<h2>Build a setup</h2>
    <div class="card calc" id="builder"><div class="filters" style="margin:0 0 10px">
      <label>Setup <select id="bsetup">${B.setups.map(n => `<option>${esc(n)}</option>`).join("")}</select></label>
      <label>Players <input type="number" id="bplayers" min="${B.min_players}" max="${B.max_players}" placeholder="usual" style="width:70px"></label>
      <label>Yakuza <input type="number" id="byakuza" min="1" placeholder="any" style="width:60px"></label>
      <label>Pool <select id="bpool">${B.pools.map(n => `<option>${esc(n)}</option>`).join("")}</select></label>
      <label>Script <select id="bscript">${B.scripts.map(n => `<option>${esc(n)}</option>`).join("")}</select></label>
      <label>Seed <input type="number" id="bseed" placeholder="random" style="width:90px"></label>
      <button id="bdraw"><b>Draw</b></button><span class="small" id="bmsg"></span></div>
      <div class="filters" style="margin:0">
      <input list="rolelist" id="addrole" placeholder="Add a role…"><datalist id="rolelist">${D.roles.map(r => `<option value="${esc(r.name)}">`).join("")}</datalist>
      <select id="addtrait"><option value="">Add a trait…</option>${D.traits.flatMap(t => t.factions.length > 1 ? t.factions.map(f => `${t.name}@${f}`) : [t.name]).map(t => `<option>${esc(t)}</option>`).join("")}</select>
      <button id="clear">Clear</button><span class="muted small">Click a role or trait to remove it. Score = offset ${fmt(D.power.offset)} + role powers + trait powers (for the Village).</span></div>
      <div id="calcout" style="margin-top:14px"></div></div>
    <h2>The standard setup</h2>
    <p>The default draw: ${st.players} players, balanced by role power so the Village's estimated chance stays within ${pct(logistic(-st.band))}–${pct(logistic(st.band))}.</p>
    <div class="cols">
      <div class="card panel"><h3>Yakuza</h3>${oddsChart(st.yakuza_odds, k => k + " Yakuza")}</div>
      <div class="card panel"><h3>Neutrals</h3>${oddsChart(st.neutral_odds, k => k)}</div>
      <div class="card panel"><h3>Traits per player</h3>${oddsChart(st.trait_count_odds, k => k)}<div class="muted small">Each player's count is drawn on its own (about ${st.players} traits a game); balancing picks only which traits.</div></div>
      <div class="card panel"><h3>Village</h3><dl class="kv"><dt>At least</dt><dd>${st.min_village} non-Outsider roles, among them ${esc(needs)}</dd>
        <dt>Outsiders</dt><dd>up to ${st.max_outsiders}</dd><dt>Never drawn</dt><dd>${st.off.map(r => roleLink(r)).join(", ")}</dd></dl></div>
    </div>
    <h3>What players are told</h3><div class="box small">${linkify(S.note)}</div>
    <h2>Sample draws <button id="reroll" title="Rebuild the page for new draws" style="font-size:12px;margin-left:8px">New draws ↻</button></h2>
    <p class="muted small">Standard setups drawn by setups.py when this page was built, each as a game with its seed deals it. Bars show the estimated Village win chance; the dashed box is the balance band.</p>
    <div class="cols">${S.samples.map((s, i) => `<div class="card sample"><div style="display:flex;justify-content:space-between;align-items:baseline">
      <b>Seed ${s.seed}</b><span class="small">Village ${pct(s.village)} · <a href="#setups" data-sample="${i}">edit</a></span></div>
      ${meter(s.village)}<div class="roles">${s.roles.map(r => roleLink(r)).join("")}</div>
      <div class="small muted">Traits: ${s.traits.map(traitItem).join(", ") || "none"}</div></div>`).join("")}</div>
    <h2>Other setups</h2>${S.setups.filter(s => s.name !== "standard").map(s => `<div class="card panel" style="margin:8px 0"><b>${esc(s.name)}</b>
      <span class="muted small">${s.players[0]}–${s.players[1]} players · <code>--roles ${esc(s.name)}</code></span><div>${linkify(s.describe)}</div></div>`).join("")}
    <h2>Rule settings</h2><p class="muted small">The rules text describes the defaults; any other choice adds a note after the rules.</p>
    <table><tr><th>Setting</th><th>Default</th><th>Other choices</th></tr>${D.settings.map(s => `<tr><td><code>--${esc(s.name.replace(/_/g, "-"))}</code></td>
      <td>${esc(s.default)}</td><td>${Object.entries(s.notes).map(([c, n]) => `<div><b>${esc(c)}</b>: ${linkify(n)}</div>`).join("")}</td></tr>`).join("")}</table>
    <h2>Scripts</h2><p class="muted small">A script limits a game's roles and its rules text (<code>--script</code>).</p>
    ${Object.entries(D.scripts).map(([s, roles]) => `<div class="card panel" style="margin:8px 0"><b>${esc(s)}</b> <span class="muted small">${roles.length} roles</span>
      <div style="margin-top:4px">${s === "all" ? "every role" : roles.map(r => roleLink(r)).join(" ")}</div></div>`).join("")}`;
  $("#reroll").onclick = () => location.reload();
  $$("[data-sample]").forEach(a => a.onclick = e => { e.preventDefault(); loadDraw(S.samples[+a.dataset.sample]); $("#builder").scrollIntoView({block: "center"}); });
  $("#bdraw").onclick = drawSetup;
  $("#bsetup").onchange = () => { $("#byakuza").disabled = $("#bsetup").value !== "standard"; };
  $("#addrole").onchange = e => { if (ROLE[e.target.value]) { CALC.roles.push(e.target.value); sortRoles(); edited(); } e.target.value = ""; };
  $("#addtrait").onchange = e => { if (e.target.value) { CALC.traits.push(e.target.value); edited(); } e.target.value = ""; };
  $("#clear").onclick = () => { CALC.roles = []; CALC.traits = []; edited(); };
  renderCalc();
}

// ---------- the setup builder: draw a setup (through game_index.py serve), edit it, score it, get the command ----------
const CALC = {roles: [], traits: [], origin: null};  // origin: the draw it is, unedited (its seed reproduces it)
const sortRoles = () => CALC.roles.sort((a, b) => D.roles.indexOf(ROLE[a]) - D.roles.indexOf(ROLE[b]));
function loadDraw(d) { CALC.roles = [...d.roles]; CALC.traits = [...d.traits]; CALC.origin = d; renderCalc(); }
function edited() { CALC.origin = null; renderCalc(); }
async function drawSetup() {
  const params = new URLSearchParams();
  for (const [k, id] of [["setup", "bsetup"], ["players", "bplayers"], ["yakuza", "byakuza"], ["pool", "bpool"], ["script", "bscript"], ["seed", "bseed"]])
    if ($("#" + id).value && !$("#" + id).disabled) params.set(k, $("#" + id).value);
  $("#bmsg").textContent = "Drawing…";
  try {
    if (location.protocol === "file:") throw new Error("offline");
    const r = await fetch("handbook/draw?" + params);
    const d = await r.json();
    if (d.error) { $("#bmsg").textContent = d.error; return; }
    $("#bmsg").textContent = ""; loadDraw(d);
  } catch (e) {
    $("#bmsg").innerHTML = `Drawing needs the live page: run <code>uv run game_index.py serve</code> and open Handbook there. Meanwhile, edit a sample below.`;
  }
}
const q = s => /[\s"]/.test(s) ? `"${s.replace(/"/g, '\\"')}"` : s;
function command() {
  const o = CALC.origin, args = ["uv run mafia.py"];
  if (o) {
    args.push("--roles", o.setup + (o.players ? ":" + o.players : ""), "--seed", o.seed);
    if (o.yakuza) args.push("--yakuza", o.yakuza);
    if (o.pool !== "all") args.push("--role-pool", o.pool);
  } else {
    args.push("--roles", q(CALC.roles.join(",")), "--traits", CALC.traits.length ? q(CALC.traits.join(",")) : "none");
  }
  const script = o ? o.script : $("#bscript")?.value;
  if (script && script !== "all") args.push("--script", script);
  return args.join(" ");
}
function traitProblem(item) {  // why no seat in the setup could take this trait item, if none could
  const [names, f] = item.split("@"), ts = names.split("+");
  return CALC.roles.some(r => (!f || ROLE[r].faction === f) && ts.every(t => ROLE[r].traits.includes(t))) ? "" : "no role in the setup can get it";
}

// ---------- Power ----------
const PS = {sort: "power"};
function dbar(power, prior, faction, lo = -1.4, hi = 1.4) {
  const x = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100, z = x(0), v = x(power);
  return `<div class="dbar ${faction}"><span class="mid"></span><i style="left:${Math.min(z, v)}%;width:${Math.abs(v - z)}%"></i><b style="left:${x(prior)}%" title="prior ${fmt(prior)}"></b></div>`;
}
function traitVillage(item) {  // what a drawn or picked trait item adds to the Village's score
  const [names, f] = item.split("@");
  return names.split("+").reduce((sum, n) => { const t = TRAIT[n]; if (!t) return sum;
    return sum + (t.village[f || t.factions[0]] ?? 0); }, 0);
}
function renderCalc() {
  const score = D.power.offset + CALC.roles.reduce((s, r) => s + (ROLE[r]?.power?.power ?? 0), 0) + CALC.traits.reduce((s, t) => s + traitVillage(t), 0);
  const chance = logistic(score), count = f => CALC.roles.filter(r => ROLE[r]?.faction === f).length;
  $("#calcout").innerHTML = `<div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"><div><div class="muted small">Village win chance</div><div class="big">${pct(chance)}</div></div>
    <div><div class="muted small">Score</div><div style="font-size:18px;font-weight:600">${fmt(score)}</div></div>
    <div class="muted small">${CALC.roles.length} players: ${FACTIONS.map(f => `<span class="fname ${f}">${count(f)} ${f}</span>`).join(" · ")}</div></div>
    <div style="margin:12px 0 4px">${meter(chance)}</div>
    <div class="picked">${CALC.roles.map((r, i) => `<span class="chip ${ROLE[r]?.faction}" data-ri="${i}" title="click to remove">${icon(r, "sm")}${esc(r)}</span>`).join("")}</div>
    <div class="picked">${CALC.traits.map((t, i) => { const bad = traitProblem(t);
      return `<span class="chip${bad ? " warn" : ""}" data-ti="${i}" title="${bad ? esc(bad) + "; " : ""}click to remove">${mark(t.split("@")[0].split("+")[0])} ${esc(t)} (${fmt(traitVillage(t))})${bad ? " ⚠" : ""}</span>`; }).join("") || `<span class="muted small">No traits</span>`}</div>
    ${CALC.roles.length ? `<div class="cmd"><code id="cmd">${esc(command())}</code><button id="copy">Copy</button></div>
    <div class="muted small">${CALC.origin ? `Seed ${CALC.origin.seed}: a game with this command deals exactly this setup.` : "Edited: a hand-picked list, so players are told the roles were picked by hand (rough faction counts), and the traits go to random eligible players."}</div>` : ""}`;
  $("#copy")?.addEventListener("click", () => { navigator.clipboard?.writeText(command()); $("#copy").textContent = "Copied"; });
  $$("#calcout [data-ri]").forEach(c => c.onclick = () => { CALC.roles.splice(+c.dataset.ri, 1); edited(); });
  $$("#calcout [data-ti]").forEach(c => c.onclick = () => { CALC.traits.splice(+c.dataset.ti, 1); edited(); });
}
function renderPower() {
  const P = D.power;
  const rows = D.roles.filter(r => r.power).slice().sort((a, b) =>
    PS.sort === "name" ? a.name.localeCompare(b.name) : PS.sort === "games" ? b.power.games - a.power.games
    : PS.sort === "change" ? Math.abs(b.power.power - b.power.prior) - Math.abs(a.power.power - a.power.prior) : b.power.power - a.power.power);
  const traitRows = Object.entries(P.trait_rows).sort((a, b) => b[1].power - a[1].power);
  $("#powerbox").innerHTML = `<p class="muted small">To score a setup, use <a href="#setups">Build a setup</a>.</p>
    <h2>Role power</h2>
    <p class="muted small">How much each role adds to the Village's chance to win, in logits (+0.4 is about +10 points near even). Refit ${esc(P.written || "never")} from ${P.games} finished live games, pulled towards hand-set priors (the tick); offset ${fmt(P.offset)} (prior ${fmt(P.offset_prior)}).
      ${Object.keys(P.off).length ? `<b>Looks off:</b> ${Object.keys(P.off).map(esc).join(", ")}` : ""}</p>
    <div class="legend">${FACTIONS.map(f => `<span class="${f}"><i></i>${f}</span>`).join("")}<span>▏tick = prior</span></div>
    <div class="filters">Sort <div class="seg" id="psort">${[["power", "Power"], ["change", "Change from prior"], ["games", "Games"], ["name", "Name"]].map(([k, l]) => `<button data-s="${k}">${l}</button>`).join("")}</div></div>
    <div class="card" style="overflow-x:auto"><table class="pchart"><tr><th>Role</th><th style="width:50%">−1.4 ← Yakuza · Village → +1.4</th><th class="num">Power</th><th class="num">Prior</th><th class="num">Games</th></tr>
      ${rows.map(r => `<tr><td class="nm">${roleLink(r.name)}</td><td>${dbar(r.power.power, r.power.prior, r.faction)}</td>
        <td class="num">${fmt(r.power.power)}</td><td class="num muted">${fmt(r.power.prior)}</td><td class="num muted">${r.power.games}</td></tr>`).join("")}</table></div>
    <h2>Trait power</h2><p class="muted small">For the holder's own side; the Village's score counts it + for a Village holder, − for a Yakuza and 0 for a Neutral.</p>
    <div class="card" style="overflow-x:auto"><table class="pchart"><tr><th>Trait</th><th style="width:50%">hurts holder ← → helps holder</th><th class="num">Power</th><th class="num">Prior</th><th class="num">Games</th></tr>
      ${traitRows.map(([k, p]) => `<tr><td class="nm">${traitLink(k.split("@")[0])}${k.includes("@") ? ` <span class="muted small">(${esc(k.split("@")[1])})</span>` : ""}</td>
        <td>${dbar(p.power, p.prior, "", -0.6, 0.6)}</td><td class="num">${fmt(p.power)}</td><td class="num muted">${fmt(p.prior)}</td><td class="num muted">${p.games}</td></tr>`).join("")}</table></div>`;
  $$("#psort button").forEach(b => { b.classList.toggle("on", b.dataset.s === PS.sort); b.onclick = () => { PS.sort = b.dataset.s; renderPower(); }; });
}

// ---------- search (filters roles and traits, finds rules) ----------
function search(q) {
  RF.q = q; renderRoles(); renderTraits();
  const l = q.toLowerCase();
  $$("#rulestext .rule, #rulestext .rrole").forEach(b => b.style.display = !l || b.textContent.toLowerCase().includes(l) ? "" : "none");
}

// ---------- routing: #rules[/R4], #roles, #traits, #setups, #power; #role/Name and #trait/Name open the drawer ----------
let tab = "rules";
function show(t) { tab = t; $$("section[data-tab]").forEach(s => s.classList.toggle("on", s.dataset.tab === t));
  $$("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + t)); }
function drawer(html) { $("#dbody").innerHTML = html; $("#drawer").classList.toggle("open", !!html); $("#scrim").classList.toggle("open", !!html); if (html) $("#drawer").scrollTop = 0; }
function route() {
  const [head, ...rest] = decodeURIComponent(location.hash.slice(1)).split("/"), arg = rest.join("/");
  if (head === "role") return drawer(roleDrawer(arg));
  if (head === "trait") return drawer(traitDrawer(arg));
  drawer("");
  show(["rules", "roles", "traits", "setups", "power"].includes(head) ? head : "rules");
  if (head === "rules" && arg) {
    const target = document.getElementById("r-" + (arg.startsWith("role-") ? "role-" + encodeURIComponent(arg.slice(5)) : arg));
    if (target) { target.style.display = ""; target.scrollIntoView({block: "start"}); target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash"); }
    $$("#toc a").forEach(a => a.classList.toggle("cur", a.dataset.r === arg));
  } else window.scrollTo(0, 0);
}
function closeDrawer() { history.pushState(null, "", "#" + tab); drawer(""); }
$("#drawer .x").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer();
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
$("#q").oninput = e => search(e.target.value.trim());
$("#built").textContent = `built ${D.built}${D.commit ? " from " + D.commit : ""} · ${D.roles.length} roles · ${D.traits.length} traits`;
renderRules(); renderRoleFilters(); renderRoles(); renderRetired(); renderTraits(); renderSetups(); renderPower();
if (D.setups.samples.length) loadDraw(D.setups.samples[0]);
window.addEventListener("hashchange", route); route();
</script></body></html>
