<!doctype html>
<!-- The handbook page (handbook.py fills in the data, from the code's own sources, in the script below). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia handbook</title>
<style>
:root { --bg:#fbfbfc; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --chip:#f0f0f3; --accent:#1f6fd1;
  --hl:#fff6c2; --Village:#2e8b3e; --Yakuza:#c43a3a; --Neutral:#b07a10;
  --tint-Village:#dcfce7; --edge-Village:#4ade80; --tint-Yakuza:#fee2e2; --edge-Yakuza:#f87171;
  --tint-Neutral:#fef3c7; --edge-Neutral:#fbbf24; --shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04); }
@media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1b1b1e; --fg:#ececf0; --muted:#9a9aa2;
  --line:#2c2c30; --chip:#26262a; --accent:#6aa8f0; --hl:#4a4320; --Village:#5cc46c; --Yakuza:#f07070; --Neutral:#e0b040;
  --shadow:none; } }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font:14.5px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.bar { max-width:1240px; margin:0 auto; padding:10px 20px 0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; }
h1 { font-size:18px; margin:0; letter-spacing:-.01em; } h1 span { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
nav { display:flex; gap:2px; max-width:1240px; margin:0 auto; padding:6px 16px 0; overflow-x:auto; }
nav a { padding:7px 14px 9px; color:var(--muted); border-bottom:2px solid transparent; font-weight:550; white-space:nowrap; }
nav a.on { color:var(--fg); border-color:var(--accent); } nav a:hover { text-decoration:none; color:var(--fg); }
#q { margin-left:auto; width:260px; }
input, select, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line);
  border-radius:7px; padding:4px 9px; } button { cursor:pointer; } button:hover { border-color:var(--muted); }
main { max-width:1240px; margin:0 auto; padding:18px 20px 80px; }
section[data-tab] { display:none; } section.on { display:block; }
h2 { font-size:20px; margin:26px 0 10px; letter-spacing:-.01em; } h2:first-child { margin-top:4px; }
h3 { font-size:15px; margin:18px 0 6px; } .muted { color:var(--muted); } .small { font-size:12.5px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.chip { display:inline-block; background:var(--chip); border-radius:10px; padding:0 8px; margin:2px 3px 2px 0;
  font-size:12px; white-space:nowrap; }
.chip.warn { background:color-mix(in srgb, var(--Neutral) 18%, transparent); }
/* role icons on a badge tinted by faction, as in the HTML logs */
.ic { display:inline-block; flex:none; width:28px; height:28px; border-radius:7px; border:1px solid var(--edge);
  background:var(--icon) center/80% no-repeat, var(--tint); vertical-align:middle; position:relative; }
.ic.sm { width:20px; height:20px; border-radius:5px; vertical-align:-5px; margin-right:4px; }
.ic.lg { width:52px; height:52px; border-radius:11px; }
.Village { --tint:var(--tint-Village); --edge:var(--edge-Village); --fc:var(--Village); }
.Yakuza { --tint:var(--tint-Yakuza); --edge:var(--edge-Yakuza); --fc:var(--Yakuza); }
.Neutral { --tint:var(--tint-Neutral); --edge:var(--edge-Neutral); --fc:var(--Neutral); }
.fname { color:var(--fc); font-weight:650; }
.mark { display:inline-block; width:22px; height:22px; background:var(--mark) center/contain no-repeat; vertical-align:middle; flex:none; }
.mark.lg { width:44px; height:44px; }
a.rl, a.tl { color:inherit; border-bottom:1px dotted var(--muted); } a.rl:hover, a.tl:hover { text-decoration:none; border-color:var(--accent); color:var(--accent); }
/* rules */
.rules { display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; }
.toc { position:sticky; top:104px; align-self:start; max-height:calc(100vh - 120px); overflow:auto; font-size:13px; padding-right:6px; }
.toc b { display:block; margin:12px 0 3px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.toc a { display:block; color:var(--fg); padding:2px 6px; border-radius:5px; } .toc a:hover { background:var(--chip); text-decoration:none; }
.toc a.cur { background:var(--chip); font-weight:600; }
.toc .lbl { display:inline-block; width:34px; color:var(--muted); font-variant-numeric:tabular-nums; }
.toc .roles-toc { display:flex; flex-wrap:wrap; gap:3px; padding:2px 4px; } .toc .roles-toc a { padding:0; }
.part h2 { border-bottom:1px solid var(--line); padding-bottom:6px; }
.rule { padding:14px 18px; margin:10px 0; scroll-margin-top:110px; } .rule h3 { margin:0 0 6px; display:flex; gap:10px; align-items:baseline; }
.rule h3 .lbl { font-size:12px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);
  padding:1px 7px; border-radius:6px; }
.flash { animation:flash 1.6s ease-out; } @keyframes flash { from { background:var(--hl); } }
.txt p { margin:4px 0; } .txt .li { margin:3px 0; padding-left:16px; position:relative; }
.txt .li::before { content:"•"; position:absolute; left:3px; color:var(--muted); }
.txt .fld { font-weight:650; }
.faction-h { margin:30px 0 4px; font-size:17px; } .cat-h { margin:18px 0 6px; font-size:13px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--muted); } .cat-h span { text-transform:none; letter-spacing:0; font-weight:400; }
.rrole { display:flex; gap:12px; padding:10px 14px; margin:6px 0; scroll-margin-top:110px; }
.rrole .nm { font-weight:650; }
/* roles and traits grids */
.filters { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:0 0 14px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:0; border-radius:0; padding:4px 11px; background:var(--card); }
.seg button.on { background:var(--fg); color:var(--bg); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
.rc { padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; transition:border-color .12s, transform .12s; }
.rc:hover { border-color:var(--edge, var(--muted)); transform:translateY(-1px); }
.rc .top { display:flex; gap:10px; align-items:center; } .rc .nm { font-weight:650; font-size:15px; }
.rc .sub { font-size:12px; color:var(--muted); } .rc .sum { font-size:13.5px; flex:1; }
.group-h { grid-column:1/-1; margin:14px 0 0; font-size:13px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.pw { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.pw .track { flex:1; height:6px; background:var(--chip); border-radius:3px; position:relative; }
.pw .track i { position:absolute; top:0; bottom:0; border-radius:3px; background:var(--fc, var(--accent)); }
.pw .track .zero { position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--muted); }
/* drawer */
#drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--card); border-left:1px solid var(--line);
  box-shadow:-8px 0 30px rgba(0,0,0,.12); z-index:20; overflow:auto; padding:22px 26px 40px; transform:translateX(105%);
  transition:transform .18s ease-out; }
#drawer.open { transform:none; }
#drawer .x { position:absolute; top:14px; right:16px; border:0; font-size:20px; background:none; color:var(--muted); }
#drawer h2 { margin:0; font-size:22px; } .dh { display:flex; gap:14px; align-items:center; margin-bottom:12px; }
dl.kv { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; margin:12px 0; font-size:13.5px; }
dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; }
.box { background:var(--chip); border-radius:8px; padding:10px 14px; margin:8px 0; }
#scrim { position:fixed; inset:0; background:rgba(0,0,0,.18); z-index:19; display:none; } #scrim.open { display:block; }
/* setups and power */
.cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; }
.panel { padding:14px 18px; } .panel h3 { margin-top:0; }
.odds { display:flex; align-items:flex-end; gap:6px; height:90px; margin:8px 0 2px; }
.odds div { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; font-size:11.5px; color:var(--muted); height:100%; }
.odds i { display:block; width:100%; max-width:46px; background:var(--accent); border-radius:4px 4px 0 0; }
.odds span { margin-top:3px; color:var(--fg); font-variant-numeric:tabular-nums; }
.sample { padding:12px 16px; } .sample .roles { display:flex; flex-wrap:wrap; gap:4px 10px; margin:6px 0; font-size:13px; }
.meter { position:relative; height:10px; border-radius:5px; background:linear-gradient(90deg, color-mix(in srgb, var(--Yakuza) 45%, transparent), var(--chip) 50%, color-mix(in srgb, var(--Village) 45%, transparent)); }
.meter .band { position:absolute; top:-3px; bottom:-3px; border:1px dashed var(--muted); border-radius:4px; }
.meter .pin { position:absolute; top:-4px; width:4px; height:18px; margin-left:-2px; background:var(--fg); border-radius:2px; }
table { border-collapse:collapse; width:100%; font-size:13.5px; } th, td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; }
td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.pchart td { padding:3px 8px; } .pchart td.nm { white-space:nowrap; }
.dbar { position:relative; height:14px; min-width:200px; }
.dbar .mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--muted); }
.dbar i { position:absolute; top:2px; height:10px; background:var(--fc); border-radius:3px; opacity:.85; }
.dbar b { position:absolute; top:-1px; width:2px; height:16px; background:var(--fg); opacity:.55; margin-left:-1px; }
.calc { padding:16px 18px; } .calc .picked { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; min-height:30px; }
.calc .picked .chip { cursor:pointer; padding:2px 8px; font-size:12.5px; } .calc .picked .chip:hover { text-decoration:line-through; }
.cmd { display:flex; gap:8px; align-items:center; margin:10px 0 4px; } .cmd code { flex:1; background:var(--chip); border-radius:6px;
  padding:6px 10px; font-size:12.5px; overflow-x:auto; white-space:nowrap; }
.big { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
.legend { font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; margin:4px 0 8px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--fc); margin-right:4px; vertical-align:-1px; }
.empty { color:var(--muted); padding:20px; }
@media (max-width:820px) { .rules { grid-template-columns:1fr; } .toc { position:static; max-height:none; } #q { width:100%; } }
</style></head><body>

<script>
const D = {"built": "2026-10-13 10:58 UTC", "commit": "7f2b791", "rules": [{"title": "Part 1: The Game", "blocks": [{"kind": "rule", "label": "R1", "title": "Overview and winning", "lines": ["You are playing a Mafia-style game with around 10 players (depending on setup), each in a faction. An omniscient", "moderator runs the game. The game alternates Day and Night phases, starting with Day 1. Day 1 is for talking only:", "there are no nominations or trials, and it is shorter than later Days (R16).", "- For most roles, you win iff your faction wins. A faction typically wins iff it has players alive at the end.", "- The game ends as soon as all living players, ignoring roles that never block wins, belong to one faction. This is", "  checked after every death; deaths that happen together at night are checked together.", "- Some Neutral roles never block another faction's win (their role says so); their own wins don't depend on how", "  the game ends. Every other Neutral blocks wins: while one is alive, the game goes on. So a game that hasn't ended", "  doesn't show that a Yakuza is still alive.", "- A trait can add a condition to your own win, take your faction's win from your teammates, or make you win with", "  another faction (R24); only that last kind (Turncoat) changes when the game ends, and no trait changes which", "  faction wins."]}, {"kind": "rule", "label": "R2", "title": "Factions", "lines": ["- Village (Good): the largest faction, but with weaker roles and less information.", "- Yakuza (Evil): fewer players, stronger roles; they know each other and share a night chat.", "- Neutral: each Neutral player is their own one-person faction, even if two players have the same Neutral role.", "The list of roles in the game is not public. A role may appear more than once in a game, except these unique", "roles, which appear at most once: Smuggler, Vulture."]}, {"kind": "rule", "label": "R15", "title": "Alignments", "lines": ["Every player has one of three alignments: Good (Village), Evil (Yakuza) or Neutral. Some roles and effects change", "how a player's alignment appears; see R19."]}, {"kind": "rule", "label": "R18", "title": "Terms", "lines": ["- Living players: players who haven't died or left. Every count in these rules (\"majority\", \"random player\")", "  means living players unless it says otherwise.", "- Majority: strictly more than half; exactly half is not a majority.", "- Action: anything a role does at night by choice or by its rules (investigating, shooting, blocking, ...).", "- Visit: an action on another player counts as A visiting B, unless it is an Astral Visit (R6).", "- Astral Visit: an action that is not a visit. Abilities that react to visits (Tracker, Lookout,", "  Fortune Teller) never see or react to it.", "- Alignment check: a result that reports alignment (Sheriff, Seer). See R19 for what they see.", "- Exact-role check: a result that reports or tests an exact role (Oracle, Diviner, Ritualist, Mortician, Coroner,", "  Talent Agent, a Vigilante's kill).", "- Token: a limited-use resource a role starts with. Spent tokens are gone; a role-blocked action spends none."]}, {"kind": "rule", "label": "R11", "title": "The circle", "lines": ["Players sit in a circle. The dead (and players who leave) are removed from it."]}]}, {"title": "Part 2: The Day", "blocks": [{"kind": "rule", "label": "R4", "title": "Day phase, chat, nominations and trials", "lines": ["Chat:", "- There is a public chat and private chats between exactly two players.", "- Private messages are not secret: whenever A sends B a private message, everyone sees that A sent B a private", "  message, but only A and B see its contents.", "Nominations:", "- Any player may publicly nominate someone, including themself. All chat stops at once.", "- Everyone votes Yes/No at the same time; nobody sees another vote before casting their own. The nominator votes", "  Yes by default. There are no abstentions: a player who doesn't vote counts as voting No. Votes are secret: once", "  all votes are in, only the number of Yes votes is announced (the nominator is named), never who voted which way.", "  Each voter is privately reminded of their own vote.", "- If a majority of all votes counted are Yes, the nominee goes on trial.", "Trials:", "- The nominee says the first public message and may defend themself; others may chat publicly and privately.", "  After everyone else has had a turn, the nominee gets one last public message before the vote.", "- Then everyone votes Guilty/Innocent at the same time (no abstentions: a player who doesn't vote counts as voting", "  Innocent). Votes are secret: only the Guilty and Innocent totals are announced, never who voted which way. Each", "  voter is privately reminded of their own vote.", "- If a majority of all votes counted are Guilty, the nominee is Executed by Hanging, a Divine Attack, and the Day", "  ends immediately.", "- If three nominations pass (failed ones don't count) and all three trials end Innocent, the Day ends.", "- Some roles can change how votes are counted. If an announced vote total doesn't match the number of voters,", "  a role manipulated the count on purpose; it is not an error. One use of such a role can change every trial", "  that Day, so the number of changed totals doesn't show how many times a role was used.", "Voting Yes or Guilty on yourself is allowed."]}, {"kind": "rule", "label": "R16", "title": "Day length", "lines": ["Day chat goes around the circle in turns. Each Day the program picks a random living player to speak first;", "turns then go around the circle from them in the same order every round. Besides the endings in R4, the Day ends when a full round passes in", "which nobody sends a public message or nominates, except that anyone sent a private message during that round", "first gets one last turn. The Day also ends after at most 8 rounds (2 on Day 1)."]}, {"kind": "rule", "label": "R22", "title": "Speaking budget", "lines": ["Day messages and nominations cost speaking budget. Each player earns budget every round of a Day, up to a cap, and", "part of what they have left carries into the next Day (nothing carries over from Day 1). A message's price grows", "with its length and, after the first rounds of a Day, with the round; private messages cost less than public ones.", "A nomination costs budget too. On a trial turn prices are lower and each speaker also gets a trial-only budget,", "spent first and lost when the turn ends; the accused's first defense message is free up to a set length. The", "program sets the numbers for each game and tells every player at the start."]}, {"kind": "rule", "label": "R23", "title": "Swaps", "lines": ["Some roles can swap two players for a night. Every action that night aimed at one of them, whether or not it visits", "(including the Katana's attack, Astral checks such as the Juror's and automatic actions such as a Sleepwalker's", "visit or the Seer's pair) lands on the other instead, as if its user had chosen that player. Only the swap itself is not", "moved (the swapping player's Katana vote is). Results name the player the action's user chose, so a swapped action's", "result doesn't show the swap: a Sheriff who checked A learns B's alignment as A's. A result that lists several", "players (e.g. a group around the target) is built around B, but A and B trade places in the list, each named where", "the other would be; the roles, alignments and counts in it are still the real players', so the rest of the group can", "still hint at the swap. A Lookout who watched A watches B instead, and a Tracker sees the player its target's action", "landed on. An effect that lasts into the next Day (e.g. listening in on private messages) follows B, and its user is", "told at dawn that a swap moved it to B, unless its role says nobody is told. Effects that pick their own victim at", "random (e.g. the Jester's revenge or a Cursed player's curse, R24) aren't actions aimed at a player, so a swap doesn't", "move them: they hit whoever they draw."]}, {"kind": "rule", "label": "R13", "title": "Last wills", "lines": ["Players may write and update a last will at the start of each Night, when they choose their night action", "(everyone is asked, even with no action), at the beginning of each Day from Day 2 on (except those who died the", "night before) and during any of their own Day turns, including on Day 1. Results that arrive later in a", "night can't be added that night. When a player dies, their last will is shared publicly at once."]}, {"kind": "rule", "label": "R25", "title": "Day actions", "lines": ["Some roles act during the Day. A day action is taken on one of your own speaking turns, along with your messages;", "not on a trial turn, and not while you are puppeted. It takes effect after a random delay: anywhere from right", "after that turn to n-1 speaking turns later, n being the number of players alive when it was taken, every delay", "equally likely. Only Day speaking turns count, not trial turns; a turn that starts a trial ends with that trial. So", "its timing doesn't show whose turn it was. If the Day ends first, it takes effect as the Day ends. If you died since", "taking it, it doesn't take effect. Day actions due at the same time take effect one at a time, in random order. A", "death it causes is announced at once (R12), and the game ends if that leaves one faction (R1). A day action isn't a", "visit, and night protections don't last into the Day."]}]}, {"title": "Part 3: The Night", "blocks": [{"kind": "rule", "label": "R5", "title": "Night phase", "lines": ["Chat is off for most players; some (usually a faction, like the Yakuza) have a private night chat. The moderator", "wakes players one by one, or faction by faction, to act. When the Night ends, the moderator works out every", "effect. By default, effects are announced publicly at the start of the next Day; some are not announced."]}, {"kind": "rule", "label": "R7", "title": "Optional actions", "lines": ["Every ability is optional (\"may\") unless its role says \"must\": any player may choose not to act at Night, not to", "use a Day ability, and not to spend a token. Effects a role or trait has automatically, with no choice (e.g. a", "Sleepwalker's nightly visit, R24), aren't optional, but a role-block still stops them (R9)."]}, {"kind": "rule", "label": "R6", "title": "Visits", "lines": ["- When A performs an action on B, A visits B, unless the action is an Astral Visit.", "- A role that targets a player may target itself unless its text says otherwise (e.g. \"other than yourself\").", "- A player whose role can target others but who targets themself shows as visiting themself.", "- A player whose action can only affect themself does not show as visiting anyone.", "- An action that targets no player (e.g. the Clerk's rig) is not a visit.", "- A player who visits the same target with several actions in one night is one visitor to that target: anything", "  that lists, counts or reacts to visitors (a watch, a Veteran's alert) treats them once."]}, {"kind": "rule", "label": "R9", "title": "Role-blocks", "lines": ["A role-blocked player's actions that night have no effect, exactly as if they had chosen not to act: no visit,", "no tokens spent. It lasts only that one night (not the next Day or later nights). Role-blocked players are told", "they were role-blocked. Any player can be role-blocked unless their role says otherwise; blocking a player who", "has no night action, or who chose not to act, has no other effect, but they are still told. A role-blocker learns", "only whether the block failed because its target can't be role-blocked.", "A result a role gets with no action at all (its text says \"This needs no action\") isn't an action, so a role-block", "doesn't stop it; automatic actions, such as a Sleepwalker's visit or the Seer's random pair, are stopped (R7)."]}, {"kind": "rule", "label": "R10", "title": "Simultaneous night resolution", "lines": ["All night actions happen at the same time. Think of it as two steps: first everyone attempts their actions,", "then all results happen together. So investigations that give their result at the end of the night (e.g. the", "Seer's random pair) draw from and report on everyone alive when the night began, including players who die that", "night."]}, {"kind": "rule", "label": "R21", "title": "Effects that outlast their user", "lines": ["An effect set up at night for the following Day (e.g. a Clerk's rig, a Prosecutor's prosecution) still happens if", "its user dies that night, unless it needs its user to act during that Day (e.g. a Puppeteer writing the puppet's", "messages); those lapse. Any token spent on it is gone either way (R18)."]}, {"kind": "rule", "label": "R20", "title": "Night resolution checklist", "lines": ["a summary of the rules above, in the order the moderator applies them.", "1. Remove actions of role-blocked players (R9), automatic ones included (a Sleepwalker's visit, the Seer's pair).", "   Party Animal, Pharmacist, Smuggler and Veteran can't be role-blocked. Swaps (R23) apply before anything else.", "2. Work out who visits whom (R6), including the Katana holder's visit (R8) and a Sleepwalker's random visit.", "3. Attacks: each kills iff its level beats the target's Defense (R3). Defenses don't stack; the highest counts.", "   A trap stops one attack before Defense and may hit its attacker back (Trapper).", "4. Results for investigators, using the visits and appearances (R19).", "5. Notifications: attackers learn whether they succeeded, attacked players learn the attacking role (R3, with the", "   Katana exception in R8), protectors learn whether they stopped an attack (R17), role-blocked players are told", "   (R9), Yakuza learn each other's actions (R8).", "6. Deaths are revealed at the start of the Day (R12); the win check runs on all of the night's deaths together (R1)."]}]}, {"title": "Part 4: Attacks, Death And Information", "blocks": [{"kind": "rule", "label": "R3", "title": "Attack and Defense", "lines": ["- Levels, lowest to highest: None, Basic, Standard, Strong, Divine. Players have Defense None by default.", "- An Attack kills iff its level is strictly higher than the target's Defense.", "- Defenses don't stack: a player with several sources of Defense has the highest of them.", "- By default the attacker learns whether the Attack succeeded (not the target's Defense), and the target learns", "  the role that attacked them (not the attacker's name or Attack level). A target hit by several Attacks in one", "  night learns the role behind each, including those that failed. The Katana is an exception (R8)."]}, {"kind": "rule", "label": "R17", "title": "Protection feedback", "lines": ["Protectors (e.g. the Medic) are told whether their protection stopped an attack, but not whose attack it was, and a", "protected player is never told who protected them. A player who is attacked is still told as in R3. An attack of", "level None (R24) counts as stopped by any protection on its target."]}, {"kind": "rule", "label": "R12", "title": "Death reveals", "lines": ["When someone dies, their cause of death (e.g. Katana, Vigilante, Execution by Hanging) and last will are revealed", "publicly; their role and alignment are not. If several attacks were each fatal, every fatal cause is revealed;", "attacks the player survived aren't. The dead leave the circle and can't take part in the game any more. A player", "whose win ends their part in the game (a hanged Jester, an Executioner who leaves) is the exception: the", "announcement of their win names their role."]}, {"kind": "rule", "label": "R14", "title": "Stall rule", "lines": ["If a Day begins and nobody has died in the three previous Nights and three previous Days, everyone loses. Deaths", "from last Night count even though they're announced today. Every death counts; leaving (like the Executioner's)", "doesn't."]}, {"kind": "rule", "label": "R19", "title": "What investigations see", "lines": ["Alignment checks (Sheriff: Evil / Not Evil; Seer: compares Good / Neutral / Evil) see a player's true alignment,", "except:", "- Yakuza holding the Katana at the end of the night: Good (Sheriff: Not Evil), even if they died that night.", "- Player framed by the Fabricator that night: Evil.", "- A player with the Notorious or Turncoat trait (R24): Evil.", "- Sheriff on Neutrals: Jester and Executioner read Evil; Serial Killer and Arsonist read Not Evil. (Seers see", "  every Neutral as Neutral.)", "The Census Taker's count is not an alignment check: it always sees true alignment, so none of the exceptions", "above apply to it (a Turncoat counts as Good).", "Exact-role checks see the true role, except that they see a Disguised player's disguise (R24). The Roleplayer is", "seen as \"Roleplayer\".", "Token counts (Accountant) see the true total at the end of the night. The Roleplayer is seen as having 0 tokens,", "even though they believe they have their fake role's tokens.", "Visit-based results (Tracker, Lookout, Fortune Teller, Cartographer, Scout) are never changed by any of these."]}, {"kind": "rule", "label": "R24", "title": "Traits", "lines": ["Some players also have a trait: an extra ability on top of their role. You are told your own trait at the start", "(except a hidden trait, which says so); nobody else is told, not even your teammates, and whether a game has any", "traits is secret. Investigations never see traits: they report roles and alignments only. A trait stays with you if", "your role changes. Traits are always true: a Roleplayer's trait is real even though its role isn't. A player may", "have more than one trait, but never the same one twice. Each trait says which players can get it. A trait's night", "action is used in addition to your role's own, and a role-block stops it too.", "- Martyr (Village players only): if you are hanged, the announcement of your death also says you were a Martyr and", "  names every player whose vote counted as Guilty in your trial. Your role stays hidden. A Martyr who dies any", "  other way shows nothing.", "- Armed (Village players only): once per game, at night, you may fire a hidden gun at another living player: a", "  Basic Attack. It is an action and a visit, and a role-blocked shot isn't used up. You learn only whether it", "  killed its target. A kill's cause is \"a hidden gun\".", "- Cursed (Village players only): if you die, a random living Good player (if any) is dealt a Divine Attack at the", "  end of the night: the night you died, or the night after the Day you died. It comes after all of that night's", "  other actions and attacks, so the victim is drawn from the Good players still alive then, and it counts as a", "  death that night. Its cause is \"a curse\". It needs no action, so a role-block doesn't stop it.", "- Avenger (Village players only): if you are killed at night, every player whose attack would have killed you is", "  dealt a Divine Attack and dies too, with the cause \"Avenger\". Attacks that weren't fatal on their own, and deaths", "  by Day, set nothing off. It needs no action, so a role-block doesn't stop it.", "- Kindred (Village players only): after each trial vote you cast, you privately learn up to two random other", "  players whose votes counted the same way as the vote you cast (if fewer did, you learn that). It needs no action,", "  so a role-block doesn't stop it.", "- Remorseful (Village players only): if you vote Guilty in a trial and that player is hanged and was Village (their", "  true alignment), you die at once; the cause is \"remorse\". It goes by the vote you cast. It isn't an attack, so", "  nothing that reacts to attacks counts it. Nobody holds both Remorseful and Zealot.", "- Faultline (Village players only): after each trial vote you cast, you privately learn one random other player", "  whose vote counted as Guilty and one whose vote counted as Innocent (if all the others voted one way, you learn", "  that). It needs no action, so a role-block doesn't stop it.", "- Notorious (Village players only): alignment checks see you as Evil (R19). Checks that see", "  true alignment, such as the Census Taker's count, aren't fooled.", "- Grudge (any player): if you are hanged, the next night one random player whose vote counted as Guilty in your", "  trial, among those alive when that night begins, is dealt a Standard Attack (an Astral Visit). Defense and", "  protection apply as usual. A kill's cause is \"a grudge\". It needs no action, so a role-block doesn't stop it.", "- Loud (any player): you earn 1.5 times the usual speaking budget each round, and your cap is 1.5 times the usual", "  (R22). Your prices and trial-only budget are the usual ones.", "- Curt (any player): the length part of your message prices (R22) is doubled, so long messages cost you much more;", "  each message's base fee, nominations and your trial-only budget are the usual ones.", "- Confidant (any player): once per game, on one of your own Day turns (not while puppeted), you may send one", "  private message hidden: nobody else is told it was sent, and the public ledger doesn't count it. Its recipient", "  sees that it was hidden. Players who hear private messages (e.g. the Wiretap) still hear it, also marked hidden.", "- Zealot (any player): every Guilty/Innocent trial vote you cast counts as Guilty, whatever you vote, including in", "  your own trial. Your nomination (Yes/No) votes are unchanged. Your private reminder shows both the vote you cast", "  and how it counted, and everything that reports how you voted (e.g. the Auditor, a Martyr's announcement) uses the", "  vote as counted. A Fixer's reversal doesn't change it. Nobody holds both Zealot and Merciful.", "- Merciful (any player): like Zealot, but your trial votes always count as Innocent.", "- Drowsy (hidden; any player whose role has a night action and can be role-blocked): on each night, with", "  probability 1/2, you are role-blocked (R9) with no blocker. You aren't told you have this trait; on those nights", "  you are told you were role-blocked, as with any role-block.", "- Spare Blade (Yakuza players only): once per game, at night, you may make one extra Katana attack on another", "  living player, whoever holds the Katana and besides its own attack (which the Yakuza still choose as usual, R8).", "  It is Standard, an action and a visit by you, and its target learns only that they were attacked with the Katana.", "  A role-block stops it, and then it isn't used up.", "- Paranoid (hidden; Village players only): on each night, with probability 1/4, you are told you were attacked and", "  survived, though nobody attacked you. You aren't told you have this trait. Nothing else happens: it isn't a visit", "  or an attack, and nobody else learns of it.", "- Stocked (any player whose role starts with tokens): you start with one more of each kind of token your role", "  starts with.", "- Disguised (any player): you are told a Village role (never your own), drawn at the start. Every exact-role check", "  (R18) sees you as that role instead of yours, alive or dead; alignment checks still see your true alignment.", "- Bonded (Village and Yakuza players only): you and one other random Village or Yakuza player are bonded, and each", "  of you is told the other's name (not their role or faction). If either of you dies, the other dies of heartbreak", "  at once (its cause is \"heartbreak\"). Heartbreak isn't an attack, so nothing that reacts to attacks counts it.", "- Rival (Village and Yakuza players only): you and one other random player of your own faction are rivals, and", "  each of you is told the other's name (not their role). Each of you wins only if your faction wins and the other", "  has died by the end; whether you are alive doesn't matter. Your faction's win doesn't change. Nobody holds Rival", "  with Bonded or Turncoat.", "- Selfish (Village and Yakuza players only): you win only if your faction wins and you are alive at the end. Your", "  faction's win doesn't change; you just don't share it if you died.", "- Selfless (Village and Yakuza players only): you win only if your faction wins and you are dead at the end. Your", "  faction's win doesn't change; you just don't share it if you're alive. Nobody holds both Selfless and Selfish.", "- Usurper (unique: at most one a game; Yakuza players only): you win only if the Yakuza win while you are the only", "  Yakuza alive, and then you take the win alone: the other Yakuza, alive or dead, don't win. If the Yakuza win with", "  another Yakuza alive, they win and you don't. Your teammates aren't told. Nobody holds Usurper with Selfish or", "  Selfless.", "- Shaky (hidden; Yakuza players only): every Katana attack you make (the Katana's own while you hold it, or a Spare", "  Blade attack) is level None, so it never kills (R3); it is still an attack and a visit. You aren't told you have", "  this trait. Nobody holds Shaky with Katana Expert or Katana Master.", "- Katana Expert (Yakuza players only): once per game, on a night you hold the Katana, you may make its own attack", "  Strong instead of Standard. Choose it with your night action and name the player the Katana attacks; it works", "  only if you hold the Katana at the end of that night and it attacks that player, and only then is it used up. A", "  role-block on you stops it along with the attack, and it isn't used up.", "- Katana Master (Yakuza players only): like Katana Expert, but the attack is Divine, which no Defense, protection,", "  trap or charm stops. Nobody holds both Katana Expert and Katana Master.", "- Narrow Escape (hidden; any player): once per game, on the first night an attack that isn't Divine would kill you", "  (after Defense, protection, traps and charms), you survive: every non-Divine attack on you that night fails", "  instead. It works like Strong Defense on every night until then, so a night when nothing would have killed you", "  (e.g. a Medic stopped the attack) doesn't use it up. Divine Attacks and deaths by Day aren't stopped. You aren't", "  told you have this trait; you are told about the failed attacks as for any others (R3).", "- Oblivious (hidden; any player): you are never told about an attack you survive. You aren't told you have this", "  trait. Nobody holds both Oblivious and Paranoid.", "- Sleepwalker (any player): every night you visit one random other living player, besides any action of your own;", "  code draws it, and you aren't told whom. It does nothing but visit: anything that sees or reacts to visits (R6),", "  such as a Tracker, a Lookout or a Veteran's alert, counts it. It isn't optional, but a role-block stops it (R7).", "- Turncoat (unique: at most one a game; Village players only): you win only if the Yakuza win (alive or dead), and", "  you lose otherwise, even if the Village wins. Alignment checks see you as Evil (R19); checks that see true", "  alignment, such as the Census Taker's count, see you as Good. You stay Village in every other way: you aren't in", "  the Yakuza's chat or Katana votes, you don't know who the Yakuza are, and they aren't told about you. The game's", "  end ignores you, like a role that never blocks wins (R1): it ends when the other living players are all Village", "  or all Yakuza. Nobody holds Turncoat with Notorious, Selfish or Selfless."]}]}, {"title": "Part 5: The Yakuza", "blocks": [{"kind": "rule", "label": "R8", "title": "Yakuza and the Katana", "lines": ["- One random Yakuza starts with the Katana. The Yakuza share a private chat at night.", "- Each night the Yakuza vote, at the same time, on who holds the Katana that night (and the next Day) and whom it", "  attacks, if anyone. Both choices need a majority of living Yakuza; with two Yakuza alive, both must agree.", "  Without a majority on a target, no attack happens; without a majority on a holder, the Katana doesn't move.", "  A majority may move the Katana without attacking. That is the Katana's one attack a night; a trait (R24) can", "  add a second, so two players may be attacked with the Katana in one night.", "- The Katana attack is Standard (a trait can change its level, R24) and is dealt by whoever holds it at the end", "  of the night. It is an action and a", "  visit by that player (the new holder, if it moved that night): role-blocking them stops it, and Trackers see", "  them visit the target. Moving or passing the Katana isn't an action: a role-block doesn't stop it (a blocked", "  new holder still gets the Katana, but their attack fails), and it isn't a visit.", "- The holder may also use their own role's night action.", "- The holder appears Good to alignment checks that night (R19).", "- The attacked player only learns they were attacked with the Katana, not the Yakuza role.", "- At the end of the night, each Yakuza learns what actions the other Yakuza chose, but not their results", "  (e.g. whether the Pharmacist's block worked) or whether a teammate was role-blocked.", "- Role-blocked Yakuza still vote on the Katana's holder and target; the votes aren't actions.", "- If the holder dies, the Katana passes to a random living Yakuza, if any; a holder who dies at night passes it on", "  after that night's results. The living Yakuza are told who holds it now (and so learn that the holder died)."]}]}, {"title": "Part 6: Roles", "blocks": [{"kind": "text", "lines": ["Every role lists the same fields. Defaults, unless a role says otherwise: Defense None, no tokens, appears as its", "true alignment (R19), night action is a visit."]}, {"kind": "faction", "title": "Village (Good)", "lines": []}, {"kind": "category", "title": "Townsfolk", "note": "most villagers, helpful to the Village"}, {"kind": "role", "name": "Vanilla Villager", "lines": ["  Night: none."]}, {"kind": "category", "title": "Investigative", "note": ""}, {"kind": "role", "name": "Sheriff", "lines": ["  Night: may investigate one player. Learn Evil or Not Evil (alignment check, R19)."]}, {"kind": "role", "name": "Tracker", "lines": ["  Night: may track one player. Learn whom they visited."]}, {"kind": "role", "name": "Lookout", "lines": ["  Night: may watch one player. Learn who visited them, not counting your own visit."]}, {"kind": "role", "name": "Seer", "lines": ["  Tokens: 1 seer token.", "  Night: at the end of every night, you are told two random players other than yourself who were alive when the", "  night began (players who die that night count, R10), and whether their alignments (Good/Neutral/Evil) are the", "  same (alignment check, R19). Instead, you may spend a token to choose the", "  two living players yourself (not including yourself). A chosen pair is a visit to both players; the random", "  pair isn't a visit. A role-block stops both."]}, {"kind": "role", "name": "Fortune Teller", "lines": ["  Night: at the end of every night, you learn two numbers about that night, each labeled: how many players were", "  visited (a player visited several times counts once), and how many players visited anyone (a player who visited", "  several players counts once). This needs no action. Self-visits (R6) count in both numbers.", "  Example: A holds the Katana, attacks B and also uses their own role's action on C, D visits B, and E protects", "  themself. Visited: B, C and E, so 3. Visitors: A, D and E, so 3. Equal numbers don't mean nobody was visited", "  twice."]}, {"kind": "role", "name": "Oracle", "lines": ["  Night: may guess one player's exact role (Astral Visit). At the end of the night, learn whether you were right."]}, {"kind": "role", "name": "Eavesdropper", "lines": ["  Night: may eavesdrop on one player. Only during the following Day (not the Night you eavesdrop), you read the contents of every private", "  message they send or receive, as it is sent. Puppeted messages reach you as the puppet's (you aren't told about", "  the puppeting). They aren't told."]}, {"kind": "role", "name": "Archivist", "lines": ["  Tokens: 1 archive token.", "  Night: may spend the token to consult the archive. At the end of the night, let N be the number of players other", "  than you who were alive when the night began (players who died that night count): you are shown N roles, in", "  random order and without names, of which floor(0.5 * N) are real and the rest are fake. The real ones are the", "  roles of floor(0.5 * N) of those players, chosen at random; a role appears as many times as it was drawn, so", "  two drawn Vanilla Villagers show twice. This is an exact-role check (R19).", "  Each fake is drawn at random from all the roles in these rules, including roles that are in the game, except", "  that the result never shows a unique role (R2) twice."]}, {"kind": "role", "name": "Surveyor", "lines": ["  Tokens: 3 survey tokens.", "  Night: may spend a token to survey one player other than yourself. The group is that player plus their nearest", "  neighbor on each side in the circle (R11) among the players alive at the start of the night, skipping yourself", "  and never counting anyone twice (so with only one or two other players alive, the group is smaller). You are", "  told who was in the group and the exact role of one of them chosen at random, but not whose it is. Players who", "  die that night can still be chosen. This is an exact-role check (R19)."]}, {"kind": "role", "name": "Census Taker", "lines": ["  Night: may take a census around one player other than yourself (a visit to that player only).", "  The program adds two other players drawn at random from everyone alive at the start of the night except you", "  (players who die that night can be drawn; if fewer than two others are left, the group is smaller). It also", "  draws at random whether to count Good or Evil players. You are told who was in the group, which alignment was", "  counted, and how many of the group are of it. It counts true alignment and is not an alignment check (R19):", "  the Katana holder, framed players and Notorious players count as what they really are, a Turncoat (R24) counts", "  as Good, though they win with the Yakuza, and Outsiders (e.g. the Roleplayer) count as Good. Neutral players are never counted, as either Good or Evil."]}, {"kind": "role", "name": "Coroner", "lines": ["  Tokens: 3 coroner tokens.", "  Night: may spend a token to examine one player who died before the night began (not one who left the game, and not", "  one who dies tonight). You learn their role, unless a Mortician cleaned them: then you learn only that. This is an", "  Astral Visit (R6) and an exact-role check (R19)."]}, {"kind": "role", "name": "Chronicler", "lines": ["  Tokens: 2 chronicler tokens.", "  Night: may spend a token to mark one player other than yourself. This is a visit. The marked player isn't told.", "  The mark lasts for the rest of the game, even after you die. If a marked player dies, at any time and of any", "  cause, the announcement of their death also reveals their true role to everyone (an exact-role check, R19), and", "  says they had been marked by a Chronicler (not by whom). A Mortician's clean beats the mark: a marked player who", "  is cleaned has their role and will hidden, and the announcement says they had been marked but the clean hid their", "  role. You can't mark a player you already marked. Marking a player another Chronicler already marked spends your", "  token but adds nothing."]}, {"kind": "role", "name": "Auditor", "lines": ["  Night: may audit one player other than yourself. You learn every vote they cast during the Day just before this", "  Night, in order: Yes or No on each nomination and Guilty or Innocent in each trial. If they cast none, you learn", "  that. A doubled vote (Ballot Stuffer) shows as a single Guilty or Innocent."]}, {"kind": "role", "name": "Juror", "lines": ["  Night: may name two different players other than yourself (dead players allowed; Astral Visit). You learn how many", "  times they voted the same way, over every Day so far, counted separately for trial votes (Guilty/Innocent) and", "  nomination votes (Yes/No), e.g. \"the same way in 3 of 4 trial votes and 5 of 9 nomination votes\". Only votes", "  both of them cast count, and not votes on the nomination or trial of either of them. A doubled vote (Ballot", "  Stuffer) counts once. You learn only the totals, not which votes they agreed on."]}, {"kind": "role", "name": "Bloodhound", "lines": ["  Tokens: 2 scent tokens.", "  Night: at the end of every night, code draws three random players other than you from those alive at the start of", "  the night, and you learn their names and one combined count: how many Attacks (R3) the three have made in total", "  this game, tonight's included, whether or not the Attacks killed anyone. Each player's Katana attacks, shots,", "  alert or trap hits and so on all count; a role-blocked attack never happened, so it doesn't. This needs no action", "  and a role-block doesn't stop it.", "  Night: may also spend a token to track one player other than yourself: they take one of the three places that", "  night and code draws the other two. A role-block stops the tracking (R9) but not the result."]}, {"kind": "role", "name": "Scrutineer", "lines": ["  Night: may scrutinize one player other than yourself who voted in the Day's trials (Astral Visit). Code adds two", "  random other players who voted in those trials (never you), and you learn the three names and, for each trial of", "  the Day just before this Night, how many of the three voted Guilty, e.g. \"2 in the trial of Erin; 0 in the trial", "  of Frank\". You don't learn which of them voted which way. A doubled vote (Ballot Stuffer) counts once. If there", "  was no trial that Day, you learn that."]}, {"kind": "role", "name": "Profiler", "lines": ["  Tokens: 3 profile tokens.", "  Night: may spend a token to profile one player other than yourself. You learn three different roles, exactly one", "  of which is that player's true role. Of the other two, one is drawn at random from the roles of the other players", "  alive at the start of the night (including players who die that night, but not yourself), and the other from the", "  roles that no player in the game has. At least one of the three is a Good role and at least one is not Good (Evil", "  or Neutral), so a result never settles the player's alignment on its own; which of the two supplies the missing", "  side is random. When no role fits a draw, that one is drawn from all roles in these rules instead. The three are", "  different and listed in alphabetical order. This is an exact-role check (R19)."]}, {"kind": "role", "name": "Cartographer", "lines": ["  Tokens: 2 map tokens.", "  Night: at the end of every night, you learn the sizes of that night's visit groups. Link two players whenever one", "  visited the other that night (R6). Direction is ignored: A visiting B links them exactly as B visiting A", "  would. A group is a set of players linked to each other, directly or through other players. Every player alive at", "  the start of the night (including players who die that night) is in exactly one group, so a player who visited no", "  one and was visited by no one is a group of 1, and a self-visit links no one. You learn only the sizes, largest", "  first (e.g. \"4, 2, 1, 1, 1\"). This needs no action and a role-block doesn't stop it.", "  Night: may also spend a token to map one player (Astral Visit; yourself allowed): at the end of the night you also", "  learn the names of everyone in that player's group. A role-block stops the map (R9) but not the sizes.", "  Your own actions never visit anyone, so they never link you to anyone."]}, {"kind": "role", "name": "Scout", "lines": ["  Night: at the end of every night, you learn the names of three players (you may be one of them) who were each in a", "  different visit group that night. Groups are as for the Cartographer (visit direction is ignored). The names are", "  drawn like this: a random player, then a random player outside the groups already drawn from, and so on, so a big", "  group is more likely to come up than a small one. If there were fewer than three groups, you learn one name per", "  group and how many groups there were. This needs no action and a role-block doesn't stop it. You never visit", "  anyone."]}, {"kind": "role", "name": "Insomniac", "lines": ["  Tokens: 2 insomniac tokens.", "  Night: may spend a token to stay awake. At the end of the night, you learn the roles of up to 3 players who visited", "  someone that night (R6; a visit to themselves counts), but not who they are: if more than 3 players visited, 3 of", "  them are drawn at random. The roles are listed in alphabetical order, and a role shows twice if two of those", "  players have it. If fewer than 3 players visited, you learn all of their roles, and if nobody visited, you learn", "  that. Players who visited and then died that night count. Only visits count: an action that isn't a visit (e.g.", "  an Astral Visit or a Veteran's alert) doesn't. Staying awake is not a visit. This is an exact-role check (R19)."]}, {"kind": "role", "name": "Accountant", "lines": ["  Night: may audit one player. Learn how many tokens they have in total at the end of the night, after any they", "  spent that night and any a Magpie stole (token count, R19). You learn only the total, not what kind of tokens", "  they are.", "  If their role changed at the end of this night, the role just before the change counts."]}, {"kind": "category", "title": "Protective", "note": ""}, {"kind": "role", "name": "Medic", "lines": ["  Tokens: 2 medic tokens.", "  Night: may protect one player other than yourself, giving them Standard Defense. Spend 1 token to give Strong", "  Defense instead, and 1 token to protect yourself instead of another player; the two can be combined (so", "  protecting yourself costs 1 token with Standard Defense and 2 with Strong)."]}, {"kind": "role", "name": "Trapper", "lines": ["  Night: may place a trap on one player other than yourself and other than the player your trap is already on, or", "  may remove your trap (removing it isn't a visit). You have one trap at a time; a new trap replaces the old one at", "  once. Traps last even after you die. A trap is armed from the next night on: the first time anyone makes a Basic,", "  Standard or Strong Attack on the trapped player on a later night, the trap is used up and stops that attack", "  (chosen at random if there are several; Divine Attacks ignore it); any other attacks resolve as usual. Several", "  traps on one player act one at a time, in random order, each stopping a different attack. The trap acts before", "  Defense, after any protection that acts before all others. If the stopped attack was a visit, its attacker is", "  dealt a Strong Attack, whatever their faction; an Astral attack is stopped without one. You learn that your trap", "  went off, and nothing else (not whose attack, nor whether the trap killed)."]}, {"kind": "role", "name": "Kitsune", "lines": ["  Tokens: 1 kitsune token.", "  Night: if you hold no swallowed attack, may lay a fox charm on one player other than yourself (on yourself, spend", "  the token). The charm acts before any other protection: it swallows one Basic, Standard or Strong Attack on that", "  player tonight, including attacks that other actions set off (chosen at random if there are several; Divine", "  Attacks ignore it), which then has no effect (its attacker and target are told as for any failed attack, R3); any", "  other attacks on them resolve as usual. Several charms on one player act one at a time, in random order, each", "  swallowing a different attack. You keep the swallowed attack and learn its level and how its kill would be", "  announced. While you hold it you can't lay a charm: on a night you choose a target, you release it on that player", "  (not yourself), as an Attack of the same level whose kill is announced with the same cause (a released Katana", "  attack reads as a Katana death), and a survivor is told it came from that cause's role. You keep the attack until", "  you release it, and it's lost if you die. You learn whether your charm swallowed an attack, and whether your", "  release killed."]}, {"kind": "category", "title": "Killing", "note": ""}, {"kind": "role", "name": "Vigilante", "lines": ["  Tokens: 3 vigilante tokens.", "  Night: may shoot one player: 1 token for a Basic Attack, 2 for Standard, 3 for Strong. If your shot kills them,", "  you also learn their role (exact-role check, R19)."]}, {"kind": "role", "name": "Enforcer", "lines": ["  Tokens: 3 enforcer tokens.", "  Night: may visit one player other than yourself. If they made an Attack of their own choosing tonight (fatal or", "  not; a Katana attack counts for its holder, and releasing a swallowed attack counts; a Veteran's alert, a trap or", "  a revenge doesn't count), you deal them a Basic Attack. Spend 1 token to also visit a second player, and 1 token", "  to make your Attack Strong; the two can be combined. If both players you visit made an Attack, one of them, chosen", "  at random, is attacked. Tokens are spent whether or not you attack. You learn whether you attacked and whether it", "  killed; with one target you know whom, with two you aren't told which."]}, {"kind": "role", "name": "Veteran", "lines": ["  Tokens: 3 alert tokens.", "  You can't be role-blocked.", "  Night: may spend a token to go on alert (not a visit, R6, so nothing that reacts to visits counts it). While on", "  alert you have Standard Defense and you deal a Strong Attack to every player who visits you that night, whatever", "  their faction (a role-blocker who visits you is attacked too), however many there are. Astral Visits aren't", "  visits, so they aren't attacked. At the end of the night you learn whether anyone visited you and, if so, how", "  many, and whether your attack on each of them succeeded, but nothing about who they were."]}, {"kind": "role", "name": "Sniper", "lines": ["  Tokens: 3 sniper tokens.", "  Day: on one of your own speaking turns (once a Day), may take a shot at one player: 1 token for a Basic Attack, 2", "  for Standard, 3 for Strong. It is fired after a random delay (R25): everyone is told that someone shot at that", "  player, then whether they died; nobody is told who shot. If the target died before then, the shot isn't fired:", "  its tokens come back, and you may take another shot that Day. A Defense from a night effect (e.g. the Medic's) has", "  ended by Day."]}, {"kind": "category", "title": "Support", "note": ""}, {"kind": "role", "name": "Prosecutor", "lines": ["  Tokens: 2 prosecutor tokens.", "  Night: may spend a token to prosecute someone. At the start of the next Day, before anyone speaks, the moderator", "  announces that someone is being prosecuted; this counts as a successful nomination and they go to trial. It", "  counts toward the Day's three-nomination limit, an execution ends the Day as usual, and it can combine with a", "  Clerk's rig. If the trial needs a \"nominator\", the moderator picks a random player."]}, {"kind": "role", "name": "Party Animal", "lines": ["  Immune to role-blocks.", "  Night: may visit one player, role-blocking them."]}, {"kind": "role", "name": "Philanthropist", "lines": ["  Tokens: 2 philanthropy tokens.", "  Night: may spend a token to hand another player one token of their own role's kind (e.g. a medic token to a", "  Medic; one kind chosen at random if their role has several). They are told a Philanthropist handed them a token.", "  If their role has no tokens, they are told they threw it away because they have no use for it, so it doesn't", "  count toward their tokens (e.g. for the Accountant). You are not told which happened."]}, {"kind": "category", "title": "Outsiders", "note": "Village roles: Good, and win with the Village, but the role helps the Village less or can hurt it"}, {"kind": "role", "name": "Roleplayer", "lines": ["  You are told your role is X, chosen at random at the start from Sheriff, Tracker, Lookout, Seer, Fortune Teller,", "  Oracle and Accountant.", "  You aren't told that you're a Roleplayer. The moderator gives you random results: each one is drawn at random", "  from the results your role could get that night, whatever really happened, so it is true only by chance.", "  Exact-role checks see you as Roleplayer (R19). Your night actions only happen in your imagination: they aren't", "  visits, have no effect, and no other role sees them."]}, {"kind": "faction", "title": "Yakuza (Evil)", "lines": ["All Yakuza share the Katana and night chat (R8)."]}, {"kind": "role", "name": "Grunt", "lines": ["  Night: none of its own."]}, {"kind": "role", "name": "Pharmacist", "lines": ["  Immune to role-blocks.", "  Night: may role-block one player."]}, {"kind": "role", "name": "Ritualist", "lines": ["  Tokens: 2 ritual tokens.", "  Night: may guess one player's exact role (Astral Visit), spending 1 token for a Standard Attack or 2 for a", "  Divine Attack. If right, the Attack is dealt. If wrong, the moderator publicly announces at the start of the", "  next Day that you are a Ritualist. The tokens are spent either way."]}, {"kind": "role", "name": "Puppeteer", "lines": ["  Tokens: 1 puppet token.", "  Night: may spend a token to puppet any player for the following Day (puppeting yourself changes nothing). That", "  Day, they are told they are being puppeted, and they can't chat or see private messages; nobody else is told. You", "  chat publicly and privately in their place (including seeing their private messages) and can set their claim,", "  which appears in the ledger as theirs; that is all you can do for them. They still nominate, vote and so on as", "  normal. It lasts one Day."]}, {"kind": "role", "name": "Fabricator", "lines": ["  Tokens: 1 fabricator token.", "  Night: may visit one non-Yakuza player to frame them (no token needed): that night they appear Evil to", "  alignment checks (R19); other results are unchanged. On the same visit, you may spend a token to forge that", "  player's last will (not anyone else's): if they die of any cause that night, your forged will replaces theirs.", "  Framing and forging together are one visit."]}, {"kind": "role", "name": "Clerk", "lines": ["  Tokens: 1 clerk token.", "  Night: may spend a token to rig the next Day's votes. On a rigged Day, anyone successfully nominated is executed.", "  The Guilty/Innocent vote still happens; if a majority votes Guilty, the rig is not announced, otherwise it is", "  announced publicly."]}, {"kind": "role", "name": "Smuggler", "lines": ["  Immune to role-blocks.", "  Tokens: 2 swap tokens.", "  Night: may spend a token to swap two different living players (yourself included) for the night (R23). You visit", "  both of them. Both swapped players are told they were swapped, but not with whom."]}, {"kind": "role", "name": "Ballot Stuffer", "lines": ["  Tokens: 2 ballot tokens.", "  Day: each time you vote Guilty/Innocent in a trial, you may spend a token so that this vote counts twice. You", "  choose with your vote, and role-blocks don't stop it. It never counts twice in nomination (Yes/No) votes, which", "  stay one vote each. A trial needs a majority of all votes counted, so your extra vote counts whether you vote", "  Guilty or Innocent. The announced totals include your extra vote without saying whose it is."]}, {"kind": "role", "name": "Fixer", "lines": ["  Tokens: 2 fixer tokens.", "  Night: may spend a token to fix one player other than yourself. During the following Day, every Guilty/Innocent", "  trial vote they cast counts as the opposite (Guilty as Innocent, Innocent as Guilty). Their nomination (Yes/No)", "  votes are unchanged. Nobody is told, not even them: their private reminder shows the vote they cast, while the", "  totals and anything that reports how they voted (e.g. the Auditor, the Informant, a Jester's revenge on Guilty", "  voters) use the vote as counted."]}, {"kind": "role", "name": "Diviner", "lines": ["  Night: may pick one player. If they are Yakuza, they get Strong Defense for that night. Otherwise, the group is", "  that player plus their nearest neighbor on each side in the circle (R11) among the players alive at the start of", "  the night, skipping yourself and never counting anyone twice. You are told who was in the group and the exact", "  role of one of them (exact-role check, R19), but not whose it is: it is the player you picked with 60% chance,", "  otherwise one of the others (20% each, or 40% if there is only one other). Yakuza in the group and players who", "  die that night can be drawn too."]}, {"kind": "role", "name": "Mortician", "lines": ["  Tokens: 3 mortician tokens.", "  Night: may spend a token to try to clean someone. If they die that night by any cause, they are cleaned: their", "  death is revealed publicly with its cause, but their last will shows as \"cleaned by mortician\". You are", "  privately told their role and last will. A Coroner who examines a cleaned player learns nothing, and a", "  cleaned player's role stays hidden even if a Chronicler marked them (the announcement says so). The token is", "  spent even if they survive."]}, {"kind": "role", "name": "Wiretap", "lines": ["  You passively read the contents of every private message sent during the Day, between any two players. This is", "  not a night action or a visit, so role-blocks don't stop it. Puppeted messages reach you as the puppet's (you", "  aren't told about the puppeting). Nobody is told that a Wiretap exists."]}, {"kind": "role", "name": "Informant", "lines": ["  You passively see how every player voted in each Guilty/Innocent trial vote, right after the vote. This is not a", "  night action or a visit, so role-blocks don't stop it. Nobody is told that an Informant exists, and the other", "  Yakuza aren't told the votes: what you share in the night chat is up to you."]}, {"kind": "role", "name": "Talent Agent", "lines": ["  Tokens: 3 talent tokens, at most one a night.", "  Night: may spend a token on one of these (not a visit; it targets no player). \"In play\" means the true role of a", "  player alive when the night began (an exact-role check, R19):", "  - Scan: learn one random non-Yakuza role that is in play and one random non-Yakuza role from these rules that", "    isn't.", "  - Count: name any role in these rules and learn how many players have it in play."]}, {"kind": "faction", "title": "Neutral", "lines": ["Each Neutral player is their own faction (R2)."]}, {"kind": "role", "name": "Serial Killer", "lines": ["  Defense: Standard. Appears: Not Evil to the Sheriff.", "  Win: only alone (not even with another Serial Killer).", "  Night: may deal a Strong Attack to one player."]}, {"kind": "role", "name": "Arsonist", "lines": ["  Defense: Standard. Appears: Not Evil to the Sheriff.", "  Win: only alone (not even with another Arsonist).", "  Night: may douse one player, or ignite (Astral Visit), dealing a Strong Attack to every doused player. A doused", "  player who isn't Good (Yakuza or Neutral) is told at the end of the night that an Arsonist doused them; Good", "  players are never told. Igniting uses up every douse: players who survive it are no longer doused."]}, {"kind": "role", "name": "Jester", "lines": ["  Defense: Basic. Appears: Evil to the Sheriff.", "  Never blocks wins (R1).", "  Win: iff you are hanged during a Day (other daytime deaths don't count). You lose if the game ends with you", "  alive.", "  Revenge: if you are hanged, the following night a random Guilty voter from your trial who was alive when that", "  night began is dealt a Divine Attack (Astral Visit). If nobody voted Guilty, nothing happens."]}, {"kind": "role", "name": "Executioner", "lines": ["  Defense: Basic. Appears: Evil to the Sheriff.", "  Never blocks wins (R1).", "  At the start you get a random target: any player except yourself.", "  Win: iff your target is hanged during a Day while you are alive (other daytime deaths don't count). You lose if", "  the game ends with your target alive.", "  On winning: the moderator reveals you at once and you leave the game. Leaving works exactly like dying (you", "  leave the circle for good) except it doesn't count as a death. The following night, a random Guilty voter from", "  the trial who was alive when that night began (not you, since you left) is dealt a Divine Attack (Astral Visit). If nobody voted", "  Guilty, nothing happens.", "  If your target dies any other way, or leaves the game, you become a Jester."]}, {"kind": "role", "name": "Bounty Hunter", "lines": ["  Tokens: 1 attack token. Never blocks wins (R1).", "  At the start you get 3 random targets: any players except yourself.", "  Night: may spend the token to deal a Strong Attack to one player.", "  A bounty on a target is claimed if they die by your attack or are hanged during a Day while your vote counted as", "  Guilty. If a target dies any other way (or leaves the game), that bounty is lost. Night deaths are simultaneous", "  (R10): a target you kill on the night you die still counts.", "  Win: iff you claim 2 bounties. If you are alive then, the moderator reveals you at once and you leave the game", "  (leaving works as for the Executioner). If you have died, you still win and nothing is revealed.", "  Lose: once you can no longer claim 2 bounties; if you are alive, the moderator reveals you at once and you leave", "  the game."]}, {"kind": "role", "name": "Magpie", "lines": ["  Defense: Basic. Never blocks wins (R1). Random setups include a Magpie only if at least a third of the roles have tokens.", "  Night: may steal a token from another player (a visit). It happens at the end of the night, after that night's", "  token use, so a token used tonight can't be stolen. The stolen token is gone (you can't use it). You are told", "  whether you stole one, not its kind; they are told which kind they lost. If they have no tokens, nothing", "  happens and they aren't told.", "  Win: iff you steal tokens from 3 different players (a second steal from the same player takes nothing). If you", "  are alive then, the moderator reveals you at once and you leave the game (as for the Executioner). If you died", "  that night, you still win and nothing is revealed."]}, {"kind": "role", "name": "Vulture", "lines": ["  Win: alone, if you are alive at the start of a Day (after the night's deaths) and max(floor(N/4), 2) or fewer", "  players are alive, counting yourself, where N is the number of players at the start of the game. The game then", "  ends at once and everyone else loses (wins already earned by roles that never block wins still count, R1).", "  Night: none.", "  Day: at the start of each Day, you learn a role for each player who died since the previous Day began (during that", "  Day or the night after it; not players who left the game): with 50% chance it is their true", "  role (exact-role check, R19), otherwise it is a different role drawn at random", "  from all the roles in these rules. You aren't told which. This isn't an action, so a role-block doesn't stop it."]}]}], "roles": [{"name": "Vanilla Villager", "faction": "Village", "category": "Townsfolk", "subcategory": "", "summary": "No night action.", "rules": "  Night: none.", "defense": "None", "tokens": {}, "night": false, "unique": false, "tested": true, "notes": "", "sheriff": "Not Evil", "icon": "vanilla-villager", "hooks": [], "night_note": false, "scripts": ["core"], "off": ["standard"], "power": {"prior": 0.25, "power": 0.354, "games": 66}, "traits": ["Martyr", "Armed", "Cursed", "Avenger", "Kindred", "Remorseful", "Faultline", "Notorious", "Grudge", "Loud", "Curt", "Confidant", "Zealot", "Merciful", "Paranoid", "Disguised", "Bonded", "Rival", "Selfish", "Selfless", "Turncoat", "Sleepwalker", "Narrow Escape", "Oblivious"]}, {"name": "Sheriff", "faction": "Village", "category": "Investigative", "subcategory": "Alignment check", "summary": "Night: investigate one player, learn Evil or Not Evil.", "rules": "  Night: may investigate one player. Learn Evil or Not Evil (alignment check, R19).", "defense": "None", "tokens": {}, "night": true, "unique": false, "tested": true, "notes": "Katana holder and framed players handled by the moderator", "sheriff": "Not Evil", "icon": "sheriff", "hooks": [], "night_note": false, "scripts": ["core"], "off": [], "power": {"prior": 0.55, "power": 0.701, "games": 43}, "traits": ["Martyr", "Armed", "Cursed", "Avenger", "Kindred", "Remorseful", "Faultline", "Notorious", "Grudge", "Loud", "Curt", "Confidant", "Zealot", "Merciful", "Drowsy", "Paranoid", "Disguised", "Bonded", "Rival", "Selfish", "Selfless", "Turncoat", "Sleepwalker", "Narrow Escape", "Oblivious"]}, {"name": "Tracker", "faction": "Village", "category": "Investigative", "subcategory": "Visit info", "summary": "Night: track one player, learn whom they visited.", "rules": "  Night: may track one player. Learn whom they visited.", "defense": "None", "tokens": {}, "night": true, "unique": false, "tested": true, "notes": "", "sheriff": "Not Evil", "icon": "tracker", "hooks": [], "night_note": false, "scripts": ["core"], "off": [], "power": {"prior": 0.45, "power": 0.522, "games": 26}, "traits": ["Martyr", "Armed", "Cursed", "Avenger", "Kindred", "Remorseful", "Faultline", "Notorious", "Grudge", "Loud", "Curt", "Confidant", "Zealot", "Merciful", "Drowsy", "Paranoid", "Disguised", "Bonded", "Rival", "Selfish", "Selfless", "Turncoat", "Sleepwalker", "Narrow Escape", "Oblivious"]}, {"name": "Lookout", "faction": "Village", "category": "Investigative", "subcategory": "Visit info", "summary": "Night: watch one player, learn who visited them.", "rules": "  Night: may watch one player. Learn who visited them, not counting your own visit.", "defense": "None", "tokens": {}, "night": true, "unique": false, "tested": true, "notes": "", "sheriff": "Not Evil", "icon": "lookout rt", "Confidant", "Zealot", "Merciful", "Drowsy", "Disguised", "Sleepwalker", "Narrow Escape", "Oblivious"]}, {"name": "Jester", "faction": "Neutral", "category": "Neutral", "subcategory": "", "summary": "Wins if hanged; then a Guilty voter dies. Reads Evil to the Sheriff.", "rules": "  Defense: Basic. Appears: Evil to the Sheriff.\n  Never blocks wins (R1).\n  Win: iff you are hanged during a Day (other daytime deaths don't count). You lose if the game ends with you\n  alive.\n  Revenge: if you are hanged, the following night a random Guilty voter from your trial who was alive when that\n  night began is dealt a Divine Attack (Astral Visit). If nobody voted Guilty, nothing happens.", "defense": "Basic", "tokens": {}, "night": false, "unique": false, "tested": true, "notes": "hanging win and revenge in code", "sheriff": "Evil", "icon": "jester", "hooks": ["on_death", "never blocks a win"], "night_note": true, "scripts": ["core"], "off": [], "power": {"prior": -0.15, "power": -0.147, "games": 28}, "traits": ["Grudge", "Loud", "Curt", "Confidant", "Zealot", "Merciful", "Disguised", "Sleepwalker", "Narrow Escape", "Oblivious"]}, {"name": "Executioner", "faction": "Neutral", "category": "Neutral", "subcategory": "", "summary": "Wins if their target is hanged; becomes a Jester if the target dies otherwise.", "rules": "  Defense: Basic. Appears: Evil to the Sheriff.\n  Never blocks wins (R1).\n  At the start you get a random target: any player except yourself.\n  Win: iff your target is hanged during a Day while you are alive (other daytime deaths don't count). You lose if\n  the game ends with your target alive.\n  On winning: the moderator reveals you at once and you leave the game. Leaving works exactly like dying (you\n  leave the circle for good) except it doesn't count as a death. The following night, a random Guilty voter from\n  the trial who was alive when that night began (not you, since you left) is dealt a Divine Attack (Astral Visit). If nobody voted\n  Guilt
