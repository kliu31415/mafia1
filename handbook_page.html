<!doctype html>
<!-- The handbook page (handbook.py fills in the data, from the code's own sources, in the script below). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia handbook</title>
<style>
:root { --bg:#fbfbfc; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --chip:#f0f0f3; --accent:#1f6fd1;
  --hl:#fff6c2; --Village:#2e8b3e; --Yakuza:#c43a3a; --Neutral:#b07a10;
  --tint-Village:#dcfce7; --edge-Village:#4ade80; --tint-Yakuza:#fee2e2; --edge-Yakuza:#f87171;
  --tint-Neutral:#fef3c7; --edge-Neutral:#fbbf24; --shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04); }
@media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1b1b1e; --fg:#ececf0; --muted:#9a9aa2;
  --line:#2c2c30; --chip:#26262a; --accent:#6aa8f0; --hl:#4a4320; --Village:#5cc46c; --Yakuza:#f07070; --Neutral:#e0b040;
  --shadow:none; } }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font:14.5px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.bar { max-width:1240px; margin:0 auto; padding:10px 20px 0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; }
h1 { font-size:18px; margin:0; letter-spacing:-.01em; } h1 span { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
nav { display:flex; gap:2px; max-width:1240px; margin:0 auto; padding:6px 16px 0; overflow-x:auto; }
nav a { padding:7px 14px 9px; color:var(--muted); border-bottom:2px solid transparent; font-weight:550; white-space:nowrap; }
nav a.on { color:var(--fg); border-color:var(--accent); } nav a:hover { text-decoration:none; color:var(--fg); }
#q { margin-left:auto; width:260px; }
input, select, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line);
  border-radius:7px; padding:4px 9px; } button { cursor:pointer; } button:hover { border-color:var(--muted); }
main { max-width:1240px; margin:0 auto; padding:18px 20px 80px; }
section[data-tab] { display:none; } section.on { display:block; }
h2 { font-size:20px; margin:26px 0 10px; letter-spacing:-.01em; } h2:first-child { margin-top:4px; }
h3 { font-size:15px; margin:18px 0 6px; } .muted { color:var(--muted); } .small { font-size:12.5px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.chip { display:inline-block; background:var(--chip); border-radius:10px; padding:0 8px; margin:2px 3px 2px 0;
  font-size:12px; white-space:nowrap; }
.chip.warn { background:color-mix(in srgb, var(--Neutral) 18%, transparent); }
/* role icons on a badge tinted by faction, as in the HTML logs */
.ic { display:inline-block; flex:none; width:28px; height:28px; border-radius:7px; border:1px solid var(--edge);
  background:var(--icon) center/80% no-repeat, var(--tint); vertical-align:middle; position:relative; }
.ic.sm { width:20px; height:20px; border-radius:5px; vertical-align:-5px; margin-right:4px; }
.ic.lg { width:52px; height:52px; border-radius:11px; }
.Village { --tint:var(--tint-Village); --edge:var(--edge-Village); --fc:var(--Village); }
.Yakuza { --tint:var(--tint-Yakuza); --edge:var(--edge-Yakuza); --fc:var(--Yakuza); }
.Neutral { --tint:var(--tint-Neutral); --edge:var(--edge-Neutral); --fc:var(--Neutral); }
.fname { color:var(--fc); font-weight:650; }
.mark { display:inline-block; width:22px; height:22px; background:var(--mark) center/contain no-repeat; vertical-align:middle; flex:none; }
.mark.lg { width:44px; height:44px; }
/* a trait's mark on a badge like a role icon's, tinted by the one faction that can hold it (else gray) */
.ic.tb { background:var(--mark) center/74% no-repeat, var(--tint, var(--chip)); border-color:var(--edge, var(--line)); }
a.rl, a.tl { color:inherit; border-bottom:1px dotted var(--muted); } a.rl:hover, a.tl:hover { text-decoration:none; border-color:var(--accent); color:var(--accent); }
/* rules */
.rules { display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; }
.toc { position:sticky; top:104px; align-self:start; max-height:calc(100vh - 120px); overflow:auto; font-size:13px; padding-right:6px; }
.toc b { display:block; margin:12px 0 3px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.toc a { display:block; color:var(--fg); padding:2px 6px; border-radius:5px; } .toc a:hover { background:var(--chip); text-decoration:none; }
.toc a.cur { background:var(--chip); font-weight:600; }
.toc .lbl { display:inline-block; width:34px; color:var(--muted); font-variant-numeric:tabular-nums; }
.toc .roles-toc { display:flex; flex-wrap:wrap; gap:3px; padding:2px 4px; } .toc .roles-toc a { padding:0; }
.part h2 { border-bottom:1px solid var(--line); padding-bottom:6px; }
.rule { padding:14px 18px; margin:10px 0; scroll-margin-top:110px; } .rule h3 { margin:0 0 6px; display:flex; gap:10px; align-items:baseline; }
.rule h3 .lbl { font-size:12px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);
  padding:1px 7px; border-radius:6px; }
.flash { animation:flash 1.6s ease-out; } @keyframes flash { from { background:var(--hl); } }
.txt p { margin:4px 0; } .txt .li { margin:3px 0; padding-left:16px; position:relative; }
.txt .li::before { content:"•"; position:absolute; left:3px; color:var(--muted); }
.txt .fld { font-weight:650; }
.faction-h { margin:30px 0 4px; font-size:17px; } .cat-h { margin:18px 0 6px; font-size:13px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--muted); } .cat-h span { text-transform:none; letter-spacing:0; font-weight:400; }
.rrole { display:flex; gap:12px; padding:10px 14px; margin:6px 0; scroll-margin-top:110px; }
.rrole .nm { font-weight:650; }
/* roles and traits grids */
.filters { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:0 0 14px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:0; border-radius:0; padding:4px 11px; background:var(--card); }
.seg button.on { background:var(--fg); color:var(--bg); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
.rc { padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; transition:border-color .12s, transform .12s; }
.rc:hover { border-color:var(--edge, var(--muted)); transform:translateY(-1px); }
.rc .top { display:flex; gap:10px; align-items:center; } .rc .nm { font-weight:650; font-size:15px; }
.rc .sub { font-size:12px; color:var(--muted); } .rc .sum { font-size:13.5px; flex:1; }
.group-h { grid-column:1/-1; margin:14px 0 0; font-size:13px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.pw { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.pw .track { flex:1; height:6px; background:var(--chip); border-radius:3px; position:relative; }
.pw .track i { position:absolute; top:0; bottom:0; border-radius:3px; background:var(--fc, var(--accent)); }
.pw .track .zero { position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--muted); }
/* drawer */
#drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--card); border-left:1px solid var(--line);
  box-shadow:-8px 0 30px rgba(0,0,0,.12); z-index:20; overflow:auto; padding:22px 26px 40px; transform:translateX(105%);
  transition:transform .18s ease-out; }
#drawer.open { transform:none; }
#drawer .x { position:absolute; top:14px; right:16px; border:0; font-size:20px; background:none; color:var(--muted); }
#drawer h2 { margin:0; font-size:22px; } .dh { display:flex; gap:14px; align-items:center; margin-bottom:12px; }
dl.kv { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; margin:12px 0; font-size:13.5px; }
dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; }
.box { background:var(--chip); border-radius:8px; padding:10px 14px; margin:8px 0; }
#scrim { position:fixed; inset:0; background:rgba(0,0,0,.18); z-index:19; display:none; } #scrim.open { display:block; }
/* setups and power */
.cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; }
.panel { padding:14px 18px; } .panel h3 { margin-top:0; }
.odds { display:flex; align-items:flex-end; gap:6px; height:90px; margin:8px 0 2px; }
.odds div { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; font-size:11.5px; color:var(--muted); height:100%; }
.odds i { display:block; width:100%; max-width:46px; background:var(--accent); border-radius:4px 4px 0 0; }
.odds span { margin-top:3px; color:var(--fg); font-variant-numeric:tabular-nums; }
.sample { padding:12px 16px; } .sample .roles { display:flex; flex-wrap:wrap; gap:4px 10px; margin:6px 0; font-size:13px; }
.meter { position:relative; height:10px; border-radius:5px; background:linear-gradient(90deg, color-mix(in srgb, var(--Yakuza) 45%, transparent), var(--chip) 50%, color-mix(in srgb, var(--Village) 45%, transparent)); }
.meter .band { position:absolute; top:-3px; bottom:-3px; border:1px dashed var(--muted); border-radius:4px; }
.meter .pin { position:absolute; top:-4px; width:4px; height:18px; margin-left:-2px; background:var(--fg); border-radius:2px; }
table { border-collapse:collapse; width:100%; font-size:13.5px; } th, td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; }
td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.pchart td { padding:3px 8px; } .pchart td.nm { white-space:nowrap; }
.dbar { position:relative; height:14px; min-width:200px; }
.dbar .mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--muted); }
.dbar i { position:absolute; top:2px; height:10px; background:var(--fc); border-radius:3px; opacity:.85; }
.dbar b { position:absolute; top:-1px; width:2px; height:16px; background:var(--fg); opacity:.55; margin-left:-1px; }
.calc { padding:16px 18px; } .calc .picked { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; min-height:30px; }
.calc .picked .chip { cursor:pointer; padding:2px 8px; font-size:12.5px; } .calc .picked .chip:hover { text-decoration:line-through; }
.cmd { display:flex; gap:8px; align-items:center; margin:10px 0 4px; } .cmd code { flex:1; background:var(--chip); border-radius:6px;
  padding:6px 10px; font-size:12.5px; overflow-x:auto; white-space:nowrap; }
.big { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
.legend { font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; margin:4px 0 8px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--fc); margin-right:4px; vertical-align:-1px; }
.empty { color:var(--muted); padding:20px; }
@media (max-width:820px) { .rules { grid-template-columns:1fr; } .toc { position:static; max-height:none; } #q { width:100%; } }
</style></head><body>
<header><div class="bar"><h1>Mafia handbook<span id="built"></span></h1>
  <input type="search" id="q" placeholder="Search rules, roles, traits  ( / )"></div>
<nav id="tabs"><a href="#rules">Rules</a><a href="#roles">Roles</a><a href="#traits">Traits</a><a href="#setups">Setups</a><a href="#power">Power</a></nav></header>
<main>
<section data-tab="rules"><div class="rules"><div class="toc" id="toc"></div><div id="rulestext"></div></div></section>
<section data-tab="roles"><div class="filters" id="rolefilters"></div><div class="grid" id="rolegrid"></div>
  <h2>Retired roles</h2><div id="retired"></div></section>
<section data-tab="traits"><p class="muted" id="traitintro"></p><div class="filters" id="traitfilters"></div><div class="grid" id="traitgrid"></div></section>
<section data-tab="setups"><div id="setupsbox"></div></section>
<section data-tab="power"><div id="powerbox"></div></section>
</main>
<div id="scrim"></div><aside id="drawer"><button class="x" title="Close (Esc)">✕</button><div id="dbody"></div></aside>
<script>
const D = /*DATA*/null;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ROLE = Object.fromEntries(D.roles.map(r => [r.name, r])), TRAIT = Object.fromEntries(D.traits.map(t => [t.name, t]));
const FACTIONS = ["Village", "Yakuza", "Neutral"];
const fmt = (x, d = 2) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const pct = x => Math.round(100 * x) + "%";
const logistic = s => 1 / (1 + Math.exp(-s));
const svgUrl = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

// icons: one CSS rule per role icon and trait mark
document.head.insertAdjacentHTML("beforeend", "<style>" +
  Object.entries(D.icons).map(([slug, svg]) => `.i-${slug}{--icon:${svgUrl(svg)}}`).join("") +
  D.traits.map(t => `.m-${t.slug}{--mark:${svgUrl(t.mark)}}`).join("") + "</style>");
const icon = (name, cls = "") => { const r = ROLE[name]; return r ? `<span class="ic ${cls} ${r.faction} i-${r.icon}"></span>` : ""; };
const mark = (name, cls = "") => TRAIT[name] ? `<span class="mark ${cls} m-${TRAIT[name].slug}"></span>` : "";
const traitSide = t => t.factions.length === 1 ? t.factions[0] : "";  // the faction that tints its badge, if only one
const badge = (name, cls = "") => TRAIT[name] ? `<span class="ic tb ${cls} ${traitSide(TRAIT[name])} m-${TRAIT[name].slug}"></span>` : "";
const roleLink = (name, withIcon = true) => ROLE[name]
  ? `<a class="rl" href="#role/${encodeURIComponent(name)}">${withIcon ? icon(name, "sm") : ""}${esc(name)}</a>` : esc(name);
const traitLink = (name, withMark = true) => TRAIT[name]
  ? `<a class="tl" href="#trait/${encodeURIComponent(name)}">${withMark ? mark(name) + " " : ""}${esc(name)}</a>` : esc(name);

// text: links R-numbers, roles and traits; joins the rules' hard-wrapped lines into paragraphs and bullets
const NAMES = [...D.roles.map(r => r.name), ...D.traits.map(t => t.name)].sort((a, b) => b.length - a.length);
const LINK_RE = new RegExp(`\\b(R\\d{1,2})\\b|\\b(${NAMES.map(n => n.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&")).join("|")})\\b`, "g");
function linkify(s) {
  return esc(s).replace(LINK_RE, (m, rule, name) => rule
    ? (D.rules.some(p => p.blocks.some(b => b.label === rule)) ? `<a href="#rules/${rule}">${rule}</a>` : rule)
    : ROLE[name] ? roleLink(name, false) : traitLink(name, false));
}
const FIELD = /^([A-Z][A-Za-z' -]{0,22}):(\s|$)/;
function prose(lines) {
  const items = [];
  for (const raw of lines) {
    const t = raw.trim(); if (!t) continue;
    const indent = raw.length - raw.trimStart().length, prev = items[items.length - 1];
    const bullet = /^[-*] /.test(t), field = FIELD.test(t);
    if (!prev || bullet || field || (/:$/.test(prev.text) && prev.text.length < 60) || (indent < prev.indent && !prev.bullet))
      items.push({text: bullet ? t.slice(2) : t, bullet, indent});
    else prev.text += " " + t;
  }
  return `<div class="txt">` + items.map(it => {
    let h = linkify(it.text);
    const m = it.text.match(FIELD);
    if (m && m[1].length < 24) h = `<span class="fld">${esc(m[1])}:</span>` + linkify(it.text.slice(m[1].length + 1));
    return it.bullet ? `<div class="li" style="margin-left:${Math.max(0, it.indent - 2) * 6}px">${h}</div>` : `<p>${h}</p>`;
  }).join("") + `</div>`;
}

// ---------- Rules ----------
function renderRules() {
  let toc = "", body = "";
  for (const [pi, part] of D.rules.entries()) {
    const roles = part.title.toUpperCase().includes("ROLES");
    toc += `<b>${esc(part.title)}</b>`;
    body += `<div class="part" id="part-${pi}"><h2>${esc(part.title)}</h2>`;
    let faction = "Village", rolesToc = "";
    for (const b of part.blocks) {
      if (b.kind === "rule") {
        toc += `<a href="#rules/${b.label}" data-r="${b.label}"><span class="lbl">${b.label}</span>${esc(b.title)}</a>`;
        body += `<div class="rule card" id="r-${b.label}"><h3><span class="lbl">${b.label}</span>${esc(b.title)}</h3>${prose(b.lines)}</div>`;
      } else if (b.kind === "faction") {
        faction = FACTIONS.find(f => b.title.startsWith(f)) || "Neutral";
        if (rolesToc) toc += `<div class="roles-toc">${rolesToc}</div>`; rolesToc = "";
        toc += `<a href="#rules/f-${faction}" class="${faction}"><span class="fname">${esc(b.title)}</span></a>`;
        body += `<h3 class="faction-h ${faction}" id="r-f-${faction}"><span class="fname">${esc(b.title)}</span></h3>${prose(b.lines)}`;
      } else if (b.kind === "category") {
        body += `<div class="cat-h">${esc(b.title)} ${b.note ? `<span>(${esc(b.note)})</span>` : ""}</div>`;
      } else if (b.kind === "role") {
        rolesToc += `<a href="#rules/role-${encodeURIComponent(b.name)}" title="${esc(b.name)}">${icon(b.name, "sm")}</a>`;
        body += `<div class="rrole card" id="r-role-${encodeURIComponent(b.name)}">${icon(b.name)}<div style="flex:1">
          <div><a class="nm rl" href="#role/${encodeURIComponent(b.name)}">${esc(b.name)}</a></div>${prose(b.lines)}</div></div>`;
      } else body += `<div class="muted">${prose(b.lines)}</div>`;
    }
    if (rolesToc) toc += `<div class="roles-toc">${rolesToc}</div>`;
    body += `</div>`;
  }
  $("#toc").innerHTML = toc; $("#rulestext").innerHTML = body;
}

// ---------- Roles ----------
const RF = {faction: "", q: "", category: "", status: "", script: ""};
function powerBar(p, faction, label = "power") {
  if (!p) return "";
  const lo = -1.4, hi = 1.0, x = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100, z = x(0), v = x(p.power);
  return `<div class="pw ${faction}" title="Power ${fmt(p.power)} (prior ${fmt(p.prior)}, fit from ${p.games} games): logits added to the Village's chance">
    <span>${esc(label)}</span><div class="track"><span class="zero" style="left:${z}%"></span><i style="left:${Math.min(z, v)}%;width:${Math.abs(v - z)}%"></i></div>
    <span>${fmt(p.power)}</span></div>`;
}
function roleChips(r) {
  return [r.night ? `<span class="chip">night action</span>` : "",
    ...Object.entries(r.tokens).map(([k, n]) => `<span class="chip">${n} ${esc(k)} token${n > 1 ? "s" : ""}</span>`),
    r.defense !== "None" ? `<span class="chip">${esc(r.defense)} Defense</span>` : "",
    r.unique ? `<span class="chip">unique</span>` : "", r.tested ? "" : `<span class="chip warn">untested live</span>`,
    ...r.off.map(s => `<span class="chip warn" title="the ${esc(s)} setup never draws it">not in ${esc(s)} setups</span>`)].join("");
}
function renderRoleFilters() {
  const cats = [...new Set(D.roles.map(r => r.category))];
  $("#rolefilters").innerHTML = `<div class="seg" id="ff">${["", ...FACTIONS].map(f => `<button data-f="${f}">${f || "All"}</button>`).join("")}</div>
    <select id="fc"><option value="">Every category</option>${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <select id="fs"><option value="">Tested or not</option><option value="tested">Live-tested</option><option value="untested">Untested live</option></select>
    <select id="fsc"><option value="">Every script</option>${Object.keys(D.scripts).filter(s => s !== "all").map(s => `<option>${esc(s)}</option>`).join("")}</select>
    <span class="muted small" id="rcount"></span>`;
  $$("#ff button").forEach(b => b.onclick = () => { RF.faction = b.dataset.f; renderRoles(); });
  $("#fc").onchange = e => { RF.category = e.target.value; renderRoles(); };
  $("#fs").onchange = e => { RF.status = e.target.value; renderRoles(); };
  $("#fsc").onchange = e => { RF.script = e.target.value; renderRoles(); };
}
const hay = r => [r.name, r.category, r.subcategory, r.summary, r.rules, r.notes, r.faction].join(" ").toLowerCase();
function renderRoles() {
  $$("#ff button").forEach(b => b.classList.toggle("on", b.dataset.f === RF.faction));
  const q = RF.q.toLowerCase();
  const shown = D.roles.filter(r => (!RF.faction || r.faction === RF.faction) && (!RF.category || r.category === RF.category)
    && (!RF.status || (RF.status === "tested") === r.tested) && (!RF.script || r.scripts.includes(RF.script))
    && (!q || hay(r).includes(q)));
  let html = "", group = "";
  for (const r of shown) {
    const g = r.faction + (r.category && r.category !== r.faction ? " · " + r.category : "");
    if (g !== group) { html += `<div class="group-h">${esc(g)}</div>`; group = g; }

const TF = {faction: "", hidden: "", effect: ""};

const GROUPS = () => [...new Set(D.traits.map(traitGroup))].sort((a, b) => b.endsWith("only") - a.endsWith("only")
  || (a === "Any faction") - (b === "Any faction") || FACTIONS.findIndex(f => a.startsWith(f)) - FACTIONS.findIndex(f => b.startsWith(f)));

    t.roles.length < sameFaction ? `<span class="chip" title="${esc(t.roles.join(", "))}">${t.roles.length} of ${sameFaction} roles</span>` : "",
    t.excludes.length ? `<span class="chip warn">never with ${t.excludes.map(esc).join(", ")}</span>` : ""].join("");

}

}

// ---------- the setup builder: draw a setup (through game_index.py serve), edit it, score it, get the command ----------
const CALC = {roles: [], traits: [], origin: null};  // origin: the draw it is, unedited (its seed reproduces it)
const sortRoles = () => CALC.roles.sort((a, b) => D.roles.indexOf(ROLE[a]) - D.roles.indexOf(ROLE[b]));
function loadDraw(d) { CALC.roles = [...d.roles]; CALC.traits = [...d.traits]; CALC.origin = d; renderCalc(); }
function edited() { CALC.origin = null; renderCalc(); }
async function drawSetup() {
  const params = new URLSearchParams();
  for (const [k, id] of [["setup", "bsetup"], ["players", "bplayers"], ["yakuza", "byakuza"], ["pool", "bpool"], ["script", "bscript"], ["seed", "bseed"]])
    if ($("#" + id).value && !$("#" + id).disabled) params.set(k, $("#" + id).value);
  $("#bmsg").textContent = "Drawing…";
  try {
    if (location.protocol === "file:") throw new Error("offline");
    const r = await fetch("handbook/draw?" + params);
    const d = await r.json();
    if (d.error) { $("#bmsg").textContent = d.error; return; }
    $("#bmsg").textContent = ""; loadDraw(d);
  } catch (e) {
    $("#bmsg").innerHTML = `Drawing needs the live page: run <code>uv run game_index.py serve</code> and open Handbook there. Meanwhile, edit a sample below.`;
  }
}
const q = s => /[\s"]/.test(s) ? `"${s.replace(/"/g, '\\"')}"` : s;
function command() {
  const o = CALC.origin, args = ["uv run mafia.py"];
  if (o) {
    args.push("--roles", o.setup + (o.players ? ":" + o.players : ""), "--seed", o.seed);
    if (o.yakuza) args.push("--yakuza", o.yakuza);
    if (o.pool !== "all") args.push("--role-pool", o.pool);
  } else {
    args.push("--roles", q(CALC.roles.join(",")), "--traits", CALC.traits.length ? q(CALC.traits.join(",")) : "none");
  }
  const script = o ? o.script : $("#bscript")?.value;
  if (script && script !== "all") args.push("--script", script);
  return args.join(" ");
}
function traitProblem(item) {  // why no seat in the setup could take this trait item, if none could
  const [names, f] = item.split("@"), ts = names.split("+");
  return CALC.roles.some(r => (!f || ROLE[r].faction === f) && ts.every(t => ROLE[r].traits.includes(t))) ? "" : "no role in the setup can get it";
}

// ---------- Power ----------
const PS = {sort: "power"};
function dbar(power, prior, faction, lo = -1.4, hi = 1.4) {
  const x = v => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * 100, z = x(0), v = x(power);
  return `<div class="dbar ${faction}"><span class="mid"></span><i style="left:${Math.min(z, v)}%;width:${Math.abs(v - z)}%"></i><b style="left:${x(prior)}%" title="prior ${fmt(prior)}"></b></div>`;
}
function traitVillage(item) {  // what a drawn or picked trait item adds to the Village's score
  const [names, f] = item.split("@");
  return names.split("+").reduce((sum, n) => { const t = TRAIT[n]; if (!t) return sum;
    return sum + (t.village[f || t.factions[0]] ?? 0); }, 0);
}
function renderCalc() {

    <div class="picked">${CALC.traits.map((t, i) => { const bad = traitProblem(t);

    ${CALC.roles.length ? `<div class="cmd"><code id="cmd">${esc(command())}</code><button id="copy">Copy</button></div>
    <div class="muted small">${CALC.origin ? `Seed ${CALC.origin.seed}: a game with this command deals exactly this setup.` : "Edited: a hand-picked list, so players are told the roles were picked by hand (rough faction counts), and the traits go to random eligible players."}</div>` : ""}`;
  $("#copy")?.addEventListener("click", () => { navigator.clipboard?.writeText(command()); $("#copy").textContent = "Copied"; });
  $$("#calcout [data-ri]").forEach(c => c.onclick = () => { CALC.roles.splice(+c.dataset.ri, 1); edited(); });
  $$("#calcout [data-ti]").forEach(c => c.onclick = () => { CALC.traits.splice(+c.dataset.ti, 1); edited(); });
}

    <div class="filters">Sort <div class="seg" id="psort">${[["power", "Power"], ["change", "Change from prior"], ["games", "Games"], ["name", "Name"]].map(([k, l]) => `<button data-s="${k}">${l}</button>`).join("")}</div></div>
    <div class="card" style="overflow-x:auto"><table class="pchart"><tr><th>Role</th><th style="width:50%">−1.4 ← Yakuza · Village → +1.4</th><th class="num">Power</th><th class="num">Prior</th><th class="num">Games</th></tr>
      ${rows.map(r => `<tr><td class="nm">${roleLink(r.name)}</td><td>${dbar(r.power.power, r.power.prior, r.faction)}</td>
        <td class="num">${fmt(r.power.power)}</td><td class="num muted">${fmt(r.power.prior)}</td><td class="num muted">${r.power.games}</td></tr>`).join("")}</table></div>
    <h2>Trait power</h2><p class="muted small">For the holder's own side; the Village's score counts it + for a Village holder, − for a Yakuza and 0 for a Neutral.</p>
    <div class="card" style="overflow-x:auto"><table class="pchart"><tr><th>Trait</th><th style="width:50%">hurts holder ← → helps holder</th><th class="num">Power</th><th class="num">Prior</th><th class="num">Games</th></tr>
      ${traitRows.map(([k, p]) => `<tr><td class="nm">${traitLink(k.split("@")[0])}${k.includes("@") ? ` <span class="muted small">(${esc(k.split("@")[1])})</span>` : ""}</td>
        <td>${dbar(p.power, p.prior, "", -0.6, 0.6)}</td><td class="num">${fmt(p.power)}</td><td class="num muted">${fmt(p.prior)}</td><td class="num muted">${p.games}</td></tr>`).join("")}</table></div>`;
  $$("#psort button").forEach(b => { b.classList.toggle("on", b.dataset.s === PS.sort); b.onclick = () => { PS.sort = b.dataset.s; renderPower(); }; });
}

// ---------- search (filters roles and traits, finds rules) ----------
function search(q) {
  RF.q = q; renderRoles(); renderTraits();
  const l = q.toLowerCase();
  $$("#rulestext .rule, #rulestext .rrole").forEach(b => b.style.display = !l || b.textContent.toLowerCase().includes(l) ? "" : "none");
}

// ---------- routing: #rules[/R4], #roles, #traits, #setups, #power; #role/Name and #trait/Name open the drawer ----------
let tab = "rules";
function show(t) { tab = t; $$("section[data-tab]").forEach(s => s.classList.toggle("on", s.dataset.tab === t));
  $$("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + t)); }
function drawer(html) { $("#dbody").innerHTML = html; $("#drawer").classList.toggle("open", !!html); $("#scrim").classList.toggle("open", !!html); if (html) $("#drawer").scrollTop = 0; }
function route() {
  const [head, ...rest] = decodeURIComponent(location.hash.slice(1)).split("/"), arg = rest.join("/");
  if (head === "role") return drawer(roleDrawer(arg));
  if (head === "trait") return drawer(traitDrawer(arg));
  drawer("");
  show(["rules", "roles", "traits", "setups", "power"].includes(head) ? head : "rules");
  if (head === "rules" && arg) {
    const target = document.getElementById("r-" + (arg.startsWith("role-") ? "role-" + encodeURIComponent(arg.slice(5)) : arg));
    if (target) { target.style.display = ""; target.scrollIntoView({block: "start"}); target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash"); }
    $$("#toc a").forEach(a => a.classList.toggle("cur", a.dataset.r === arg));
  } else window.scrollTo(0, 0);
}
function closeDrawer() { history.pushState(null, "", "#" + tab); drawer(""); }
$("#drawer .x").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer();
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
$("#q").oninput = e => search(e.target.value.trim());
$("#built").textContent = `built ${D.built}${D.commit ? " from " + D.commit : ""} · ${D.roles.length} roles · ${D.traits.length} traits`;
renderRules(); renderRoleFilters(); renderRoles(); renderRetired(); renderTraitFilters(); renderTraits(); renderSetups(); renderPower();
if (D.setups.samples.length) loadDraw(D.setups.samples[0]);
window.addEventListener("hashchange", route); route();
</script></body></html>
