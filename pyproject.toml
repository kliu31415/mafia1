[project]
name = "mafia1"
version = "0.1.0"
description = "LLMs playing a Mafia variant (rules_1.txt)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"  # pytest-xdist: tests run in parallel, one worker per core; -n0 runs them in one process
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Bug-catching rules (undefined names, unused imports, likely mistakes), plus the line-length limit.
select = ["F", "E9", "B", "E501"]
ignore = ["B905"]  # zip() without strict=

[tool.ruff.lint.per-file-ignores]
# Their embedded HTML/CSS/JS templates (game_index.PAGE, log_viewer.CSS/JS) keep long lines.
"game_index.py" = ["E501"]
"log_viewer.py" = ["E501"]

[tool.mypy]
explicit_package_bases = true
exclude = ['\.venv', '\.claude']  # .claude/worktrees: other threads' checkouts
check_untyped_defs = true  # role hooks and tests are often unannotated; check their bodies anyway
