[project]
name = "mafia1"
version = "0.1.0"
description = "LLMs playing a Mafia variant (rules_1.txt)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Bug-catching rules only (undefined names, unused imports, likely mistakes), not style.
select = ["F", "E9", "B"]
ignore = ["B905"]  # zip() without strict=

[tool.mypy]
explicit_package_bases = true
exclude = ['\.venv']
